<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Book Zaure Clean — Zaure</title>
<meta name="description" content="Book post-construction cleaning, pest control, weed control or carpet cleaning in Kaduna.">
<meta name="theme-color" content="#05070a">
<link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#05070a;--fg:#f4f6f8;--mut:#8b97a4;--ln:rgba(255,255,255,.16);
  --gold:#D4B87A;--gold-deep:#B49450;--err:#ff7b7b;--ok:#25D366;
  --surface:#0d1117;--surface-2:#141a22;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.zb{min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--gold);transition:width .5s cubic-bezier(.2,.8,.2,1);z-index:5}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
.logo{font-size:13px;font-weight:700;letter-spacing:.32em;color:var(--fg);text-decoration:none}
.logo span{color:var(--mut);font-weight:500;margin-left:12px;letter-spacing:.18em;text-transform:uppercase}
.x{color:var(--mut);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.x:hover{color:var(--fg)}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:4vh 24px 24px}
.stage{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font-weight:300;font-size:clamp(2rem,6vw,3.4rem);line-height:1.08;letter-spacing:-.025em;margin:14px 0 12px;outline:0}
.hint{color:var(--mut);max-width:520px;margin-bottom:36px}
.f{margin-bottom:28px}
.l{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
input,textarea,select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ln);border-radius:0;color:var(--fg);font:300 1.5rem/1.3 Inter,sans-serif;padding:10px 0;outline:0;transition:border-color .2s}
textarea{resize:none;min-height:96px;font-size:1.1rem}
input::placeholder,textarea::placeholder{color:#55606b}
input:focus,textarea:focus{border-color:var(--gold)}
input[type=date]{color-scheme:dark}
.err{color:var(--err);font-size:.9rem;min-height:1.4em;margin-top:4px}
.note{color:var(--gold);font-size:.85rem;margin-top:8px;min-height:1.2em}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:720px;margin:0 auto;padding:12px 24px 28px}
.btn{font:600 .8rem Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;padding:17px 34px;border:1px solid var(--gold);background:var(--gold);color:#05070a;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--mut);border-color:transparent;padding-left:0}
.btn.ghost:hover{color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--ln)}
.row .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.row .v{font-size:1.05rem;overflow-wrap:anywhere}
.row button{background:none;border:0;color:var(--gold);font:600 .75rem Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;flex-shrink:0}
.fine{color:var(--mut);font-size:.85rem;margin-top:22px}

/* ============ CREATIVE WIDGETS (imported from zaure-clean model) ============ */

/* Option tile (icon card) — property type / "vehicle type design" */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;cursor:pointer}
.tile input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.tile-body{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border:1px solid var(--ln);border-radius:12px;background:var(--surface);text-align:center;transition:all .15s}
.tile-body i{font-size:1.15rem;color:var(--gold);margin-bottom:2px}
.tile-body strong{font-size:.8rem;font-weight:700;color:var(--fg);line-height:1.2}
.tile-body span{font-size:.68rem;color:var(--mut);line-height:1.3}
.tile:hover .tile-body{border-color:var(--gold);background:rgba(212,184,122,.04)}
.tile input:checked + .tile-body{border-color:var(--gold);background:rgba(212,184,122,.1);box-shadow:0 0 0 2px rgba(212,184,122,.12)}
.tile input:focus-visible + .tile-body{outline:2px solid var(--gold);outline-offset:2px}

/* Custom date picker */
.dp{border:1px solid var(--ln);border-radius:12px;padding:14px;background:var(--surface)}
.dp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dp-month{font-weight:700;font-size:.92rem;color:var(--fg)}
.dp-nav{width:32px;height:32px;border-radius:8px;border:none;background:var(--surface-2);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit}
.dp-nav:hover{background:rgba(255,255,255,.06)}
.dp-nav:disabled{opacity:.3;cursor:not-allowed}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dp-weekdays span{text-align:center;font-size:.68rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:4px 0}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dp-day{aspect-ratio:1;border-radius:8px;border:none;background:transparent;color:var(--fg);font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;min-height:36px}
.dp-day:hover:not(:disabled){background:rgba(255,255,255,.06)}
.dp-day.other-month{opacity:.2;pointer-events:none}
.dp-day:disabled{opacity:.25;cursor:not-allowed}
.dp-day.today{border:1.5px solid var(--gold);color:var(--gold-deep)}
.dp-day.selected{background:var(--gold);color:#05070a}
.dp-day.selected:hover{background:var(--gold-deep)}
.dp-selected{margin-top:12px;padding-top:12px;border-top:1px solid var(--ln);font-size:.82rem;color:var(--mut)}
.dp-selected strong{color:var(--fg);font-weight:700}

/* Time slots */
.time-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:480px){.time-slots{grid-template-columns:repeat(4,1fr)}}
.time-slot{padding:10px 6px;border-radius:8px;border:1px solid var(--ln);background:var(--surface);color:var(--fg);font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;min-height:40px}
.time-slot:hover{border-color:var(--gold);background:rgba(212,184,122,.05)}
.time-slot.selected{background:var(--gold);border-color:var(--gold);color:#05070a}

/* Checkbox grid (services / special) */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.check{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--ln);border-radius:9px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--fg);background:var(--surface);transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.check:hover{border-color:var(--gold);background:rgba(212,184,122,.04)}
.check input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer;flex-shrink:0;margin:0;border:0;padding:0}
.check.checked{border-color:var(--gold);background:rgba(212,184,122,.1);font-weight:700}

/* Quantity steppers */
.qty-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.qty-grid{grid-template-columns:repeat(4,1fr)}}
.qty-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--surface);border:1px solid var(--ln);border-radius:10px}
.qty-label{font-size:.7rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.qty-controls{display:flex;align-items:center;background:var(--surface-2);border-radius:8px;overflow:hidden}
.qty-controls button{width:30px;height:30px;border:none;background:transparent;color:var(--fg);font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.qty-controls button:hover{background:rgba(255,255,255,.06)}
.qty-controls input{width:32px;border:none;background:transparent;text-align:center;font-size:.85rem;font-weight:700;color:var(--fg);outline:none;font-family:inherit;padding:0;-moz-appearance:textfield;border-bottom:0}
.qty-controls input::-webkit-outer-spin-button,.qty-controls input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Error banner */
.qm-error-banner{padding:12px 16px;background:rgba(255,123,123,.08);border:1px solid rgba(255,123,123,.3);border-radius:10px;color:var(--err);font-size:.85rem;line-height:1.5;margin-bottom:14px;display:none}
.qm-error-banner.show{display:block}
.qm-error-banner i{margin-right:6px}

/* Success */
.qm-success{text-align:center;padding:30px 10px}
.qm-success-icon{width:68px;height:68px;border-radius:50%;background:rgba(37,211,102,.1);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 20px}
.qm-success h3{font-weight:600;font-size:1.3rem;color:var(--fg);margin-bottom:8px}
.qm-success p{font-size:.9rem;color:var(--mut);line-height:1.6;max-width:380px;margin:0 auto 20px}
.qm-success-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.qm-success-actions .btn{padding:13px 26px}

/* Inline note under date */
.qm-note{color:var(--gold);font-size:.82rem;margin-top:8px;min-height:1.2em}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(()=>{
const C=JSON.parse(document.getElementById('cfg').textContent),K='zb_'+C.key,N=C.steps.length;
const $=s=>document.querySelector(s),app=$('#app'),nav=$('#nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WA='2349042339411';
let S;try{S=JSON.parse(sessionStorage.getItem(K))}catch(e){}
S=S&&S.d?S:{i:0,d:{}};
const save=()=>{try{sessionStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const vis=f=>!f.showIf||S.d[f.showIf.n]===f.showIf.v;
const empty=(f,v)=>{
  if(f.t==='multi')return!(v&&v.length);
  if(f.t==='check')return!v;
  if(f.t==='qty')return false;
  return!String(v||'').trim();
};
const fmt=(f,v)=>{
  if(f.t==='multi')return v.join(', ');
  if(f.t==='check')return v?'Yes':'No';
  if(f.t==='date')return new Date(v+'T00:00').toLocaleDateString('en-NG',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  if(f.t==='time')return v;
  return v;
};

/* date picker state per field */
const dpState={};

function validate(st){
  for(const f of st.fields){
    if(!vis(f))continue;
    const v=S.d[f.n];
    if(f.req!==false&&empty(f,v)){
      if(f.t==='qty')continue;
      if(f.t==='date')return 'Please pick a date.';
      if(f.t==='time')return 'Please pick a start time.';
      return 'Please complete this to continue.';
    }
    if(f.t==='tel'&&v&&String(v).replace(/\D/g,'').length<10)return 'Enter a valid phone number.';
    if(f.t==='date'&&v&&v<today())return 'Choose today or a later date.';
  }
  return '';
}

/* ---- renderers ---- */

function renderTiles(f,v){
  return `<div class="tiles" role="radiogroup" aria-label="${esc(f.l)}">
    ${f.opts.map(o=>{
      const[t,s,icon]=o;
      const on=v===t;
      return `<label class="tile">
        <input type="radio" name="tile_${f.n}" value="${esc(t)}" ${on?'checked':''} data-tile="${esc(t)}">
        <div class="tile-body">
          <i class="fas ${esc(icon||'fa-square')}"></i>
          <strong>${esc(t)}</strong>
          <span>${esc(s)}</span>
        </div>
      </label>`;
    }).join('')}
  </div>`;
}

function renderQty(f,v){
  const val=v??f.v??0;
  return `<div class="f" data-n="${f.n}">
    <div class="l">${esc(f.l)}</div>
    <div class="qty-item" style="max-width:140px">
      <div class="qty-controls">
        <button type="button" data-qty="${f.n}" data-op="-"><i class="fas fa-minus"></i></button>
        <input type="number" name="${f.n}" value="${val}" min="${f.min??0}" max="${f.max??99}" readonly>
        <button type="button" data-qty="${f.n}" data-op="+"><i class="fas fa-plus"></i></button>
      </div>
    </div>
  </div>`;
}

function renderDate(f,v){
  if(!dpState[f.n]){
    const base=v?new Date(v+'T00:00'):new Date();
    dpState[f.n]={viewMonth:base.getMonth(),viewYear:base.getFullYear(),selected:v?new Date(v+'T00:00'):null};
  }
  return `<div class="f" data-n="${f.n}">
    <div class="l">${esc(f.l)}</div>
    <div class="dp" data-dp="${f.n}">
      <div class="dp-header">
        <button type="button" class="dp-nav" data-dp-prev="${f.n}" aria-label="Previous month"><i class="fas fa-chevron-left"></i></button>
        <div class="dp-month" data-dp-month="${f.n}">—</div>
        <button type="button" class="dp-nav" data-dp-next="${f.n}" aria-label="Next month"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="dp-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="dp-grid" data-dp-grid="${f.n}"></div>
      <div class="dp-selected">Selected: <strong data-dp-sel="${f.n}">${v?fmt(f,v):'None yet'}</strong></div>
    </div>
    <input type="hidden" name="${f.n}" value="${esc(v||'')}" data-hidden="${f.n}">
    <div class="qm-note" data-dp-note="${f.n}"></div>
  </div>`;
}

function paintDate(f){
  const st=dpState[f.n];if(!st)return;
  const grid=document.querySelector(`[data-dp-grid="${f.n}"]`);
  const monthEl=document.querySelector(`[data-dp-month="${f.n}"]`);
  const prevBtn=document.querySelector(`[data-dp-prev="${f.n}"]`);
  if(!grid||!monthEl)return;
  const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  monthEl.textContent=`${M[st.viewMonth]} ${st.viewYear}`;
  const firstDay=new Date(st.viewYear,st.viewMonth,1).getDay();
  const daysInMonth=new Date(st.viewYear,st.viewMonth+1,0).getDate();
  const t=new Date();t.setHours(0,0,0,0);
  let html='';
  const prevDays=new Date(st.viewYear,st.viewMonth,0).getDate();
  for(let i=firstDay-1;i>=0;i--)html+=`<button type="button" class="dp-day other-month" tabindex="-1" disabled>${prevDays-i}</button>`;
  for(let d=1;d<=daysInMonth;d++){
    const thisDate=new Date(st.viewYear,st.viewMonth,d);thisDate.setHours(0,0,0,0);
    const isPast=thisDate<t;
    const isToday=thisDate.getTime()===t.getTime();
    const isSel=st.selected&&thisDate.getTime()===st.selected.getTime();
    let cls='dp-day';if(isToday)cls+=' today';if(isSel)cls+=' selected';
    const iso=`${st.viewYear}-${String(st.viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html+=`<button type="button" class="${cls}" data-dp-day="${f.n}" data-date="${iso}" ${isPast?'disabled':''}>${d}</button>`;
  }
  grid.innerHTML=html;
  const now=new Date();
  prevBtn.disabled=(st.viewYear===now.getFullYear()&&st.viewMonth===now.getMonth());
  // note
  const noteEl=document.querySelector(`[data-dp-note="${f.n}"]`);
  if(noteEl&&st.selected&&C.lead){
    const d=(st.selected-new Date(today()+'T00:00'))/864e5;
    noteEl.textContent=d<C.lead?`Less than ${C.lead} days away. We will confirm availability.`:'';
  }
}

function renderTime(f,v){
  const slots=['7:00 AM','8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM'];
  return `<div class="f" data-n="${f.n}">
    <div class="l">${esc(f.l)}</div>
    <div class="time-slots" data-time-group="${f.n}">
      ${slots.map(t=>`<button type="button" class="time-slot${v===t?' selected':''}" data-time="${esc(t)}">${esc(t)}</button>`).join('')}
    </div>
    <input type="hidden" name="${f.n}" value="${esc(v||'')}" data-hidden="${f.n}">
  </div>`;
}

function renderMulti(f,v){
  const arr=v||[];
  return `<div class="f" data-n="${f.n}">
    <div class="l">${esc(f.l)}</div>
    <div class="checks" role="group" aria-label="${esc(f.l)}">
      ${f.opts.map(o=>{
        const t=Array.isArray(o)?o[0]:o;
        const on=arr.includes(t);
        return `<label class="check${on?' checked':''}">
          <input type="checkbox" value="${esc(t)}" ${on?'checked':''} data-multi="${f.n}">
          <span>${esc(t)}</span>
        </label>`;
      }).join('')}
    </div>
  </div>`;
}

function renderChoice(f,v){
  return `<div class="f" data-n="${f.n}">
    <div class="l">${esc(f.l)}</div>
    <div class="checks" role="radiogroup" aria-label="${esc(f.l)}">
      ${f.opts.map(o=>{
        const t=Array.isArray(o)?o[0]:o;
        const on=v===t;
        return `<label class="check${on?' checked':''}">
          <input type="radio" name="ch_${f.n}" value="${esc(t)}" ${on?'checked':''} data-choice="${f.n}">
          <span>${esc(t)}</span>
        </label>`;
      }).join('')}
    </div>
  </div>`;
}

function field(f){
  if(!vis(f))return '';
  const v=S.d[f.n];
  if(f.t==='multi')return renderMulti(f,v);
  if(f.t==='choice')return renderChoice(f,v);
  if(f.t==='tiles')return `<div class="f" data-n="${f.n}"><div class="l">${esc(f.l)}</div>${renderTiles(f,v)}</div>`;
  if(f.t==='qty')return renderQty(f,v);
  if(f.t==='date')return renderDate(f,v);
  if(f.t==='time')return renderTime(f,v);
  if(f.t==='check'){
    return `<div class="f" data-n="${f.n}">
      <label class="check${v?' checked':''}" style="padding:14px 16px">
        <input type="checkbox" ${v?'checked':''} data-check="${f.n}">
        <span>${esc(f.l)}</span>
      </label>
    </div>`;
  }
  if(f.t==='textarea'){
    return `<div class="f" data-n="${f.n}"><label class="l" for="i_${f.n}">${esc(f.l)}</label><textarea id="i_${f.n}" rows="3" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea></div>`;
  }
  // text / tel
  return `<div class="f" data-n="${f.n}">
    <label class="l" for="i_${f.n}">${esc(f.l)}</label>
    <input id="i_${f.n}" type="${f.t==='tel'?'tel':'text'}" ${f.t==='tel'?'inputmode="tel" autocomplete="tel"':`autocomplete="${f.ac||'off'}"`} ${f.list?`list="dl_${f.n}"`:''} placeholder="${esc(f.ph||'')}" value="${esc(v||'')}">
    ${f.list?`<datalist id="dl_${f.n}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}
  </div>`;
}

function setNav(){
  const i=S.i,last=i>=N;
  nav.innerHTML=(i===0?`<a class="btn ghost" href="${esc(C.back)}">Cancel</a>`:`<button class="btn ghost" data-a="back">Back</button>`)+
    `<button class="btn" data-a="${last?'send':'next'}" ${S.sending?'disabled':''}>${last?(S.sending?'Sending…':'Send request'):i===N-1?'Review':'Continue'}</button>`;
}

function render(){
  $('.bar').style.width=Math.min(S.i/N*100,100)+'%';
  setNav();
  if(S.i>=N)return review();
  const st=C.steps[S.i];
  app.innerHTML=`<section class="stage"><div class="eyebrow">Step ${S.i+1} of ${N}</div><h1 tabindex="-1">${esc(st.q)}</h1><p class="hint">${esc(st.h||'')}</p><div id="fs">${st.fields.map(field).join('')}</div><div class="err" role="alert" id="er"></div></section>`;
  // paint date grids
  st.fields.forEach(f=>{if(f.t==='date'&&vis(f))paintDate(f);});
  focusTop(true);
}

function focusTop(inp){
  const i=app.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),textarea');
  if(inp&&i&&matchMedia('(hover:hover)').matches)i.focus({preventScroll:true});
  else app.querySelector('h1')?.focus({preventScroll:true});
  scrollTo({top:0});
}

function rows(){
  const r=[];
  C.steps.forEach((st,si)=>st.fields.forEach(f=>{
    const v=S.d[f.n];
    if(vis(f)&&!empty(f,v))r.push([si,f.l,fmt(f,v)]);
  }));
  return r;
}

function review(){
  app.innerHTML=`<section class="stage"><div class="eyebrow">Review</div><h1 tabindex="-1">Check your request.</h1><p class="hint">Edit anything, then send it to the Zaure team.</p>${rows().map(r=>`<div class="row"><div><div class="k">${esc(r[1])}</div><div class="v">${esc(r[2])}</div></div><button data-go="${r[0]}">Edit</button></div>`).join('')}<p class="fine">${esc(C.note||'')}</p></section>`;
  focusTop();
}

function collectForSubmit(){
  const d={};
  C.steps.forEach(st=>st.fields.forEach(f=>{
    if(!vis(f))return;
    const v=S.d[f.n];
    if(empty(f,v))return;
    d[f.l]=fmt(f,v);
  }));
  return d;
}

async function sendRequest(){
  if(S.sending)return;
  const e=validate(C.steps[N-1]);
  if(e){const er=$('#er');if(er)er.textContent=e;return;}
  S.sending=true;setNav();
  const data=collectForSubmit();
  const fd=new FormData();
  fd.append('_subject','New '+C.title+' request');
  if(S.d.email)fd.append('_replyto',S.d.email);
  Object.entries(data).forEach(([k,v])=>fd.append(k,v));

  if(!C.endpoint||C.endpoint.includes('YOUR_FORM_ID')){
    // Fallback: WhatsApp
    S.sending=false;setNav();
    const msg='*New '+C.title+' request*\n\n'+Object.entries(data).map(([k,v])=>k+': '+v).join('\n')+'\n\nSent from the Zaure booking form';
    window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
    done(true);
    return;
  }

  try{
    const res=await fetch(C.endpoint,{method:'POST',body:fd,headers:{'Accept':'application/json'}});
    if(!res.ok)throw new Error('Request failed');
    done(false);
  }catch(err){
    S.sending=false;setNav();
    const er=$('#er');if(er)er.textContent='Could not send. Please check your connection or message us on WhatsApp: +234 904 233 9411';
  }
}

function done(viaWA){
  try{sessionStorage.removeItem(K)}catch(e){}
  $('.bar').style.width='100%';nav.innerHTML='';
  app.innerHTML=`<section class="stage"><div class="eyebrow">${viaWA?'One more step':'All done'}</div><h1 tabindex="-1">${viaWA?'Send it in WhatsApp.':'Request received.'}</h1><p class="hint">${viaWA?'Your details are ready in a WhatsApp message. Tap send to reach the Zaure team.':esc(C.after||'We will be in touch shortly.')}</p><div class="checks" style="grid-template-columns:1fr"><a class="check" href="${esc(C.back)}" style="justify-content:center;padding:16px"><span>Back to services</span></a></div></section>`;
  focusTop();
}

function next(){
  if(S.i<N){
    const e=validate(C.steps[S.i]);
    if(e){const er=$('#er');if(er)er.textContent=e;return;}
  }
  S.i=S.r?N:S.i+1;S.r=false;save();render();
}
function back(){S.i=S.r?N:S.i-1;S.r=false;save();render();}

/* ---- event delegation ---- */

app.addEventListener('click',e=>{
  // date picker nav
  const dpPrev=e.target.closest('[data-dp-prev]');
  if(dpPrev){
    const n=dpPrev.dataset.dpPrev,st=dpState[n];
    st.viewMonth--;if(st.viewMonth<0){st.viewMonth=11;st.viewYear--;}
    paintDate({n,t:'date'});return;
  }
  const dpNext=e.target.closest('[data-dp-next]');
  if(dpNext){
    const n=dpNext.dataset.dpNext,st=dpState[n];
    st.viewMonth++;if(st.viewMonth>11){st.viewMonth=0;st.viewYear++;}
    paintDate({n,t:'date'});return;
  }
  const dpDay=e.target.closest('[data-dp-day]');
  if(dpDay){
    const n=dpDay.dataset.dpDay;
    const iso=dpDay.dataset.date;
    dpState[n].selected=new Date(iso+'T00:00');
    S.d[n]=iso;
    document.querySelector(`[data-hidden="${n}"]`).value=iso;
    document.querySelector(`[data-dp-sel="${n}"]`).textContent=new Date(iso+'T00:00').toLocaleDateString('en-NG',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    paintDate({n,t:'date'});
    save();
    const er=$('#er');if(er)er.textContent='';
    return;
  }
  // time slot
  const slot=e.target.closest('[data-time]');
  if(slot){
    const group=slot.parentElement;
    group.querySelectorAll('.time-slot').forEach(b=>b.classList.remove('selected'));
    slot.classList.add('selected');
    const n=group.dataset.timeGroup;
    S.d[n]=slot.dataset.time;
    const h=document.querySelector(`[data-hidden="${n}"]`);if(h)h.value=slot.dataset.time;
    save();
    const er=$('#er');if(er)er.textContent='';
    return;
  }
  // qty stepper
  const qty=e.target.closest('[data-qty]');
  if(qty){
    const n=qty.dataset.qty;
    const input=app.querySelector(`input[name="${n}"]`);
    if(!input)return;
    let val=parseInt(input.value,10)||0;
    const min=parseInt(input.min,10)||0;
    const max=parseInt(input.max,10)||99;
    val=qty.dataset.op==='+'?Math.min(max,val+1):Math.max(min,val-1);
    input.value=val;S.d[n]=val;save();return;
  }
  // nav buttons
  const a=e.target.closest('[data-a]')?.dataset.a;
  if(a==='next')next();
  else if(a==='back')back();
  else if(a==='send')sendRequest();
  // edit from review
  const go=e.target.closest('[data-go]');
  if(go){S.i=+go.dataset.go;S.r=true;save();render();return;}
});

app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.tile!==undefined){
    const f=t.closest('.f'),n=f.dataset.n;
    S.d[n]=t.dataset.tile;save();
  } else if(t.dataset.multi){
    const n=t.dataset.multi;
    const arr=new Set(S.d[n]||[]);
    if(t.checked)arr.add(t.value);else arr.delete(t.value);
    S.d[n]=[...arr];
    t.closest('.check').classList.toggle('checked',t.checked);
    save();
  } else if(t.dataset.choice){
    const n=t.dataset.choice;
    S.d[n]=t.value;
    t.closest('.checks').querySelectorAll('.check').forEach(c=>c.classList.remove('checked'));
    t.closest('.check').classList.add('checked');
    save();
  } else if(t.dataset.check){
    const n=t.dataset.check;
    S.d[n]=t.checked;
    t.closest('.check').classList.toggle('checked',t.checked);
    save();
  }
});

app.addEventListener('input',e=>{
  const fe=e.target.closest('.f');if(!fe)return;
  if(e.target.type==='number')return; // handled by stepper
  if(e.target.type==='hidden')return;
  S.d[fe.dataset.n]=e.target.value;save();
  const er=$('#er');if(er)er.textContent='';
});

app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='hidden'&&e.target.type!=='checkbox'&&e.target.type!=='radio'){
    e.preventDefault();next();
  }
});

if(S.i>N)S.i=0;
render();
})();
</script>
</body>
</html>
