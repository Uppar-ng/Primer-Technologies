<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3650;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2940;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Subtle grey border -->
  <rect x="5" y="5" width="110" height="110" rx="28" fill="none" stroke="#A0AEC0" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Decorative corner accent -->
  <rect x="22" y="22" width="6" height="6" rx="1" fill="#CBD5E1" transform="rotate(45 25 25)" opacity="0.7"/>
  <rect x="92" y="92" width="6" height="6" rx="1" fill="#CBD5E1" transform="rotate(45 95 95)" opacity="0.7"/>
  
  <!-- Main Z letter - White -->
  <path d="M 38 40 L 82 40 L 38 80 L 82 80" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Grey underline accent -->
  <rect x="38" y="88" width="44" height="3" rx="1.5" fill="#94A3B8" opacity="0.8"/>
  
  <!-- Small grey dot above Z -->
  <circle cx="60" cy="28" r="3" fill="#A0AEC0" opacity="0.8"/>
</svg>
