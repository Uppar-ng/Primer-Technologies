<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Submission Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 26px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea { resize: vertical; min-height: 100px; }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .data-preview {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            display: none;
        }

        .data-preview h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }

        .data-preview pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Data Submission Form</h1>

        <form id="dataForm">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" required />
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required />
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" required></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>

        <div id="message" class="message"></div>

        <div id="dataPreview" class="data-preview">
            <h2>Last Submitted Data:</h2>
            <pre id="previewContent"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const dataPreview = document.getElementById('dataPreview');
        const previewContent = document.getElementById('previewContent');

        // Same-origin API call — works locally and on Vercel
        const API_URL = '/api/submit';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value,
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Submitting...';
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const result = await res.json();

                if (res.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ Data submitted successfully!';
                    previewContent.textContent = JSON.stringify(result.data, null, 2);
                    dataPreview.style.display = 'block';
                    form.reset();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ Error: ' + (result.error || 'Failed to submit');
                }
            } catch (err) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Network error: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Data';
            }
        });
    </script>
</body>
</html>
