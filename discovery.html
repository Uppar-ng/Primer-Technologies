<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discovery – Zaure</title>
  <meta name="description" content="Discover products and services on Zaure - Nigeria's most trusted online marketplace.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ============================================
       PREMIUM TIKTOK FEED STYLES
       ============================================ */
    :root {
      --navy: #0f2940;
      --navy-2: #1a3650;
      --surface: #ffffff;
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    body {
      background-color: #000;
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      padding: 0 !important;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* The Vertical Feed Container */
    .tiktok-feed {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tiktok-feed::-webkit-scrollbar { display: none; }

    /* Individual Item */
    .feed-item {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    /* ============================================
       CINEMATIC MEDIA (ZOOMED OUT + BLURRED BG + VIDEO)
       ============================================ */
    .media-carousel {
      position: absolute;
      inset: 0;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      z-index: 1;
    }
    .media-carousel::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-bg {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(25px) brightness(0.3);
      z-index: 1;
    }

    .slide-img, .slide-video {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
    }

    /* Gradient Overlays */
    .overlay-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 180px;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      z-index: 5;
      pointer-events: none;
    }
    .overlay-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 320px;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%);
      z-index: 5;
      pointer-events: none;
    }

    /* Pagination Dots */
    .carousel-dots {
      position: absolute;
      bottom: 210px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.4);
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* ============================================
       TOP BAR & CATEGORY FILTER
       ============================================ */
    .top-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding-top: calc(16px + env(safe-area-inset-top));
    }
    .top-bar-main {
      padding: 0 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      text-decoration: none;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .near-me-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: white;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .near-me-btn.active {
      background: #25D366;
      border-color: #25D366;
      color: white;
    }
    .near-me-btn i { font-size: 0.8rem; }

    /* Category Filter Bar */
    .category-bar {
      display: flex;
      overflow-x: auto;
      padding: 0 20px 10px;
      gap: 8px;
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-chip {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .cat-chip.active {
      background: white;
      color: var(--navy);
      border-color: white;
    }

    /* ============================================
       BOTTOM DETAILS & SEE MORE
       ============================================ */
    .bottom-info {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 20px;
      right: 85px;
      z-index: 10;
    }
    .item-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--navy-2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .badge.price {
      background: #fff;
      color: var(--navy);
      font-size: 1rem;
      padding: 5px 16px;
      letter-spacing: 0;
    }
    .item-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    /* Expandable Description */
    .item-desc-wrapper {
      position: relative;
      margin-bottom: 10px;
    }
    .item-desc {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .item-desc.expanded {
      -webkit-line-clamp: unset;
      display: block;
    }
    .see-more-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0;
      margin-top: 2px;
      cursor: pointer;
      display: inline-block;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .item-seller-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .item-seller-link:hover { text-decoration: underline; }

    /* ============================================
       RIGHT ACTION SIDEBAR
       ============================================ */
    .action-sidebar {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .action-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .action-btn:active { transform: scale(0.85); }
    
    .action-label {
      font-size: 0.6rem;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .action-btn.liked {
      color: #ff2d55;
      border-color: #ff2d55;
      background: rgba(255, 45, 85, 0.15);
    }
    .action-btn.liked i { animation: popHeartBtn 0.4s ease; }
    .action-btn.wa { background: linear-gradient(135deg, #25D366, #1DA851); border: none; }

    /* ============================================
       GIANT DOUBLE-TAP HEART
       ============================================ */
    .giant-heart {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 140px;
      color: #ff2d55;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 0 30px rgba(255,45,85,0.6));
    }
    .giant-heart.animate {
      animation: heartBurst 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(0.9) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
    }
    @keyframes popHeartBtn {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    /* ============================================
       SELLER QUICK-PEEK MODAL (BOTTOM SHEET)
       ============================================ */
    .seller-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .seller-modal-overlay.active {
      opacity: 1; visibility: visible;
    }
    .seller-modal {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      color: var(--navy);
      border-radius: 24px 24px 0 0;
      padding: 24px 24px 40px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
    }
    .seller-modal-overlay.active .seller-modal {
      transform: translateY(0);
    }
    .modal-drag-handle {
      width: 40px; height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .seller-profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .seller-avatar-lg {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--navy-2);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 700;
      overflow: hidden;
    }
    .seller-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .seller-info-lg h3 {
      font-size: 1.2rem; font-weight: 800; color: var(--navy);
      margin-bottom: 2px;
    }
    .seller-info-lg .verified-badge {
      font-size: 0.7rem; font-weight: 700; color: #1DA851;
      display: flex; align-items: center; gap: 4px;
    }
    .seller-stats-row {
      display: flex;
      gap: 20px;
      background: #f8fbfe;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    .seller-stat { flex: 1; text-align: center; }
    .seller-stat .val { font-size: 1.1rem; font-weight: 800; color: var(--navy); }
    .seller-stat .lbl { font-size: 0.65rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }
    
    .btn-visit-store {
      display: flex; width: 100%;
      padding: 14px; border-radius: 30px;
      background: var(--navy-2); color: white;
      font-weight: 700; font-size: 0.95rem;
      text-decoration: none; justify-content: center; align-items: center; gap: 8px;
      transition: background 0.2s;
    }
    .btn-visit-store:hover { background: var(--navy); }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(26,54,80,0.95);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 3000;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Loader */
    .loader {
      height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: white;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <!-- Seller Quick-Peek Modal -->
  <div class="seller-modal-overlay" id="sellerModal" onclick="closeSellerModal(event)">
    <div class="seller-modal" onclick="event.stopPropagation()">
      <div class="modal-drag-handle"></div>
      <div class="seller-profile-header">
        <div class="seller-avatar-lg" id="modalSellerAvatar">ZA</div>
        <div class="seller-info-lg">
          <h3 id="modalSellerName">Seller Name</h3>
          <div class="verified-badge"><i class="fas fa-check-circle"></i> Verified Seller</div>
        </div>
      </div>
      <div class="seller-stats-row">
        <div class="seller-stat">
          <div class="val" id="modalSellerRating">5.0</div>
          <div class="lbl">Rating</div>
        </div>
        <div class="seller-stat">
          <div class="val" id="modalSellerListings">0</div>
          <div class="lbl">Items</div>
        </div>
        <div class="seller-stat">
          <div class="val" id="modalSellerResponse">100%</div>
          <div class="lbl">Response</div>
        </div>
      </div>
      <a href="#" class="btn-visit-store" id="modalStoreLink">
        <i class="fas fa-store"></i> Visit Store
      </a>
    </div>
  </div>

  <div class="tiktok-feed" id="tiktokFeed">
    <div class="loader">
      <div class="spinner"></div>
      <p>Curating your feed...</p>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // ============================================
    // TRACKING & SETUP (UPDATED TO MATCH SERVICE.HTML)
    // ============================================
    const ZAURE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyopnxgVhZo80kdR1Rrdr_SbivRJZXrE6cAkwOB9bWB1OklMmp3jWoe9c8W6SGM4XNhHA/exec';
    
    let guestDeviceInfo = null;
    let guestGPS = { lat: null, lng: null, maps: null, state: null };
    let isNearMeActive = false;

    // 1. Collect Guest Data
    (async function collectGuestData() {
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      
      if (user && user.state) {
        guestGPS.state = user.state;
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            guestGPS.lat = pos.coords.latitude.toFixed(6);
            guestGPS.lng = pos.coords.longitude.toFixed(6);
            guestGPS.maps = `https://www.google.com/maps?q=${guestGPS.lat},${guestGPS.lng}`;
            
            if (guestGPS.lat > 9.0) guestGPS.state = 'Kaduna'; 
            else if (guestGPS.lat > 6.5) guestGPS.state = 'Lagos';
          },
          () => {},
          { timeout: 5000 }
        );
      }
      guestDeviceInfo = {
        userAgent: navigator.userAgent,
        platform: navigator.platform || 'Unknown',
        screen: `${screen.width}x${screen.height}`,
        isGuest: !user
      };
    })();

    // 2. Send Tracking (Exact format from service.html, plus guest data)
    function logDiscoveryInteraction(item, sellerName, action) {
      const user = JSON.parse(localStorage.getItem('zaure_user') || '{}');
      
      const payload = {
        type: 'discovery_interaction',
        action: action,
        service: item.title, // 'service' is the key used in service.html
        seller: sellerName,
        item_id: item.id,
        item_type: item._type,
        user_name: user.name || 'Guest',
        user_phone: user.phone || '',
        user_state: user.state || guestGPS.state || '',
        user_gps: guestGPS.maps || 'Not provided',
        device_info: JSON.stringify(guestDeviceInfo),
        timestamp: new Date().toISOString()
      };
      
      fetch(ZAURE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload)
      }).catch(err => console.warn('Logging failed', err));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.__toast);
      window.__toast = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ============================================
    // BUILD FEED
    // ============================================
    let feedItems = [];
    let currentCategory = 'All';

    document.addEventListener('DOMContentLoaded', async function() {
      const feedContainer = document.getElementById('tiktokFeed');

      let products = [];
      let services = [];
      try { products = await loadProducts(); } catch(e) {}
      try { services = await loadServices(); } catch(e) {}

      const pItems = products.map(p => ({ ...p, _type: 'product' }));
      const sItems = services.map(s => {
        const norm = normalizeService(s);
        return {
          id: norm.id,
          title: norm.title,
          price: null, 
          location: norm.location,
          category: norm.category,
          description: norm.description,
          seller: { 
            name: getSellerName(s), 
            phone: s.seller?.phone || s.seller?.whatsapp || '09042339411',
            id: s.seller?.id,
            profilePic: getSellerPic(s),
            rating: s.seller?.rating,
            listings: 1,
            response: '100%'
          },
          _type: 'service',
          _original: s
        };
      });

      feedItems = [...pItems, ...sItems].sort(() => Math.random() - 0.5);
      feedContainer.innerHTML = '';

      if (feedItems.length === 0) {
        feedContainer.innerHTML = `<div class="loader"><h2>No items found</h2></div>`;
        return;
      }

      renderFeed(feedItems);
    });

    function renderFeed(items) {
      const feedContainer = document.getElementById('tiktokFeed');
      feedContainer.innerHTML = '';

      const categories = ['All', ...new Set(items.map(i => i.category).filter(Boolean))];

      items.forEach((item, index) => {
        feedContainer.appendChild(createFeedItem(item, index, categories));
      });
    }

    function createFeedItem(item, index, categories) {
      const el = document.createElement('div');
      el.className = 'feed-item';
      
      // --- 1. Build Media Carousel (Image or Video) ---
      let slidesHtml = '';
      let dotsHtml = '';
      
      if (item._type === 'product') {
        if (item.video) {
          slidesHtml = `
            <div class="carousel-slide">
              <video src="${item.video}" class="slide-video" autoplay loop muted playsinline></video>
            </div>
          `;
        } else {
          const images = (item.images && item.images.length > 0) ? item.images : ['https://placehold.co/400x600?text=No+Image'];
          images.forEach((img, i) => {
            slidesHtml += `
              <div class="carousel-slide">
                <div class="slide-bg" style="background-image: url('${img}')"></div>
                <img src="${img}" alt="${item.title}" class="slide-img" loading="${i === 0 ? 'eager' : 'lazy'}" onerror="this.src='https://placehold.co/400x600?text=No+Image'">
              </div>
            `;
            dotsHtml += `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
          });
        }
      } else {
        const profilePic = item.seller?.profilePic;
        const initials = item.seller?.name ? item.seller.name.charAt(0).toUpperCase() : 'Z';
        let avatarContent = profilePic ? `<img src="${profilePic}">` : `<span style="font-size:5rem; font-weight:800; color:var(--navy-2);">${initials}</span>`;
        
        slidesHtml = `
          <div class="carousel-slide">
            <div class="slide-bg" style="background: linear-gradient(135deg, var(--navy-2), var(--navy));"></div>
            <div style="position:relative; z-index:2; width:220px; height:220px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 0 10px rgba(255,255,255,0.1), 0 0 0 20px rgba(255,255,255,0.05); overflow:hidden;">
              ${avatarContent}
            </div>
          </div>
        `;
      }

      // --- 2. Build Details ---
      let badgesHtml = '';
      if (item._type === 'product') {
        const price = item.price >= 1e6 ? `₦${(item.price/1e6).toFixed(1)}M` : `₦${(item.price || 0).toLocaleString()}`;
        badgesHtml = `<span class="badge price">${price}</span><span class="badge">Product</span>`;
      } else {
        const trade = getTradeName(item.category);
        badgesHtml = `<span class="badge price" style="background:var(--navy-2); color:#fff;">Available</span><span class="badge">${trade}</span>`;
      }

      const isFav = typeof isFavorite === 'function' ? isFavorite(item.id) : false;
      const sellerName = item.seller?.name || 'Zaure Official';
      const hasDesc = item.description && item.description.length > 50;

      const catBarHtml = index === 0 ? `
        <div class="category-bar" id="categoryBar">
          ${categories.map(c => `<div class="cat-chip ${c === currentCategory ? 'active' : ''}" onclick="filterCategory('${c}')">${c}</div>`).join('')}
        </div>
      ` : '';

      el.innerHTML = `
        <div class="overlay-top"></div>
        <div class="overlay-bottom"></div>

        <div class="media-carousel">
          ${slidesHtml}
        </div>

        ${dotsHtml ? `<div class="carousel-dots">${dotsHtml}</div>` : ''}

        <i class="fas fa-heart giant-heart" id="heart-${index}"></i>

        <div class="top-header">
          <div class="top-bar-main">
            <div class="brand-group">
              <a href="/" class="brand"><i class="fas fa-bolt" style="color:#D4B87A;"></i> Zaure</a>
              <button class="near-me-btn ${isNearMeActive ? 'active' : ''}" onclick="toggleNearMe()">
                <i class="fas fa-location-arrow"></i> Near Me
              </button>
            </div>
          </div>
          ${catBarHtml}
        </div>

        <div class="bottom-info">
          <div class="item-badges">${badgesHtml}</div>
          <div class="item-title">${item.title}</div>
          
          ${item.description ? `
            <div class="item-desc-wrapper">
              <div class="item-desc" id="desc-${index}">${item.description}</div>
              ${hasDesc ? `<button class="see-more-btn" onclick="toggleDesc(${index})" id="desc-btn-${index}">See more...</button>` : ''}
            </div>
          ` : ''}

          <div class="item-meta">
            <span><i class="fas fa-map-pin"></i> ${item.location || 'Nigeria'}</span>
            <a class="item-seller-link" onclick="openSellerModal(${index})">
              <i class="fas fa-user-circle"></i> ${sellerName}
            </a>
          </div>
        </div>

        <div class="action-sidebar">
          <div class="action-btn-wrapper">
            <button class="action-btn like-btn ${isFav ? 'liked' : ''}" onclick="toggleLike(event, ${index})">
              <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
            </button>
            <span class="action-label">Like</span>
          </div>
          
          <div class="action-btn-wrapper">
            <button class="action-btn wa" onclick="contactSeller(event, ${index})">
              <i class="fab fa-whatsapp"></i>
            </button>
            <span class="action-label">Chat</span>
          </div>

          <div class="action-btn-wrapper">
            <button class="action-btn" onclick="shareItem(event, ${index})">
              <i class="fas fa-share-alt"></i>
            </button>
            <span class="action-label">Share</span>
          </div>

          <div class="action-btn-wrapper">
            <button class="action-btn" onclick="viewDetails(event, ${index})">
              <i class="fas fa-info-circle"></i>
            </button>
            <span class="action-label">Details</span>
          </div>
        </div>

        ${index === 0 ? '<div class="swipe-hint" id="swipeHint"><i class="fas fa-chevron-up"></i><span>Swipe up</span></div>' : ''}
      `;

      setupDoubleTap(el, index);
      setupCarouselScroll(el);

      return el;
    }

    // ============================================
    // FEATURE 1: CATEGORY FILTER
    // ============================================
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(c => {
        c.classList.toggle('active', c.textContent === cat);
      });
      
      let filtered = feedItems;
      if (cat !== 'All') {
        filtered = feedItems.filter(i => i.category === cat);
      }
      
      if (filtered.length === 0) {
        showToast('No items in this category.');
        return;
      }
      
      renderFeed(filtered);
      document.getElementById('tiktokFeed').scrollTo({ top: 0, behavior: 'instant' });
    }

    // ============================================
    // FEATURE 2: SEE MORE DESCRIPTION
    // ============================================
    function toggleDesc(index) {
      const desc = document.getElementById(`desc-${index}`);
      const btn = document.getElementById(`desc-btn-${index}`);
      
      if (desc.classList.contains('expanded')) {
        desc.classList.remove('expanded');
        btn.textContent = 'See more...';
      } else {
        desc.classList.add('expanded');
        btn.textContent = 'See less';
      }
    }

    // ============================================
    // FEATURE 4: NEAR ME TOGGLE
    // ============================================
    function toggleNearMe() {
      isNearMeActive = !isNearMeActive;
      const btn = document.querySelector('.near-me-btn');
      btn.classList.toggle('active', isNearMeActive);
      
      if (isNearMeActive) {
        if (!guestGPS.state) {
          showToast('Waiting for location...');
        } else {
          showToast(`Prioritizing ${guestGPS.state}`);
        }
        
        feedItems.sort((a, b) => {
          const aLoc = (a.location || '').toLowerCase();
          const bLoc = (b.location || '').toLowerCase();
          const stateLower = (guestGPS.state || '').toLowerCase();
          
          const aMatch = aLoc.includes(stateLower) ? 1 : 0;
          const bMatch = bLoc.includes(stateLower) ? 1 : 0;
          
          return bMatch - aMatch; 
        });
      } else {
        feedItems.sort(() => Math.random() - 0.5);
      }
      
      renderFeed(feedItems);
      document.getElementById('tiktokFeed').scrollTo({ top: 0, behavior: 'instant' });
    }

    // ============================================
    // FEATURE 5: SHARE BUTTON
    // ============================================
    function shareItem(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      const url = item._type === 'product' 
        ? `${window.location.origin}/detail.html?id=${item.id}`
        : `${window.location.origin}/service.html?id=${item.id}`;
        
      if (navigator.share) {
        navigator.share({
          title: item.title,
          text: `Check out this ${item._type} on Zaure!`,
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url);
        showToast('Link copied to clipboard!');
      }
    }

    // ============================================
    // FEATURE 7: SELLER QUICK-PEEK MODAL
    // ============================================
    function openSellerModal(index) {
      const item = feedItems[index];
      const seller = item.seller || {};
      
      document.getElementById('modalSellerName').textContent = seller.name || 'Zaure Official';
      document.getElementById('modalSellerRating').textContent = seller.rating || '5.0';
      document.getElementById('modalSellerListings').textContent = seller.listings || '1+';
      document.getElementById('modalSellerResponse').textContent = seller.response || '100%';
      
      const avatarEl = document.getElementById('modalSellerAvatar');
      if (seller.profilePic) {
        avatarEl.innerHTML = `<img src="${seller.profilePic}">`;
      } else {
        avatarEl.textContent = (seller.name || 'Z').charAt(0).toUpperCase();
      }

      const storeLink = document.getElementById('modalStoreLink');
      if (seller.id) {
        storeLink.href = `/store.html?id=${seller.id}`;
      } else {
        storeLink.href = `/stores.html?search=${encodeURIComponent(seller.name)}`;
      }

      document.getElementById('sellerModal').classList.add('active');
    }

    function closeSellerModal(e) {
      if (e.target.id === 'sellerModal') {
        document.getElementById('sellerModal').classList.remove('active');
      }
    }

    // ============================================
    // CAROUSEL & GESTURES
    // ============================================
    function setupCarouselScroll(itemEl) {
      const carousel = itemEl.querySelector('.media-carousel');
      const dots = itemEl.querySelectorAll('.dot');
      if (!carousel || dots.length <= 1) return;

      carousel.addEventListener('scroll', () => {
        const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
      });
    }

    function setupDoubleTap(el, index) {
      let lastTap = 0;
      const tapArea = el.querySelector('.media-carousel');

      tapArea.addEventListener('click', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) {
          triggerDoubleTapLike(el, index);
          e.preventDefault();
        }
        lastTap = now;
      });
    }

    function triggerDoubleTapLike(el, index) {
      const heart = el.querySelector('.giant-heart');
      const likeBtn = el.querySelector('.like-btn');
      const item = feedItems[index];

      heart.classList.remove('animate');
      void heart.offsetWidth; 
      heart.classList.add('animate');

      if (!likeBtn.classList.contains('liked')) {
        likeBtn.classList.add('liked');
        likeBtn.querySelector('i').className = 'fas fa-heart';
        if (typeof toggleFavorite === 'function') toggleFavorite(item.id);
      }
    }

    // ============================================
    // BASIC ACTIONS
    // ============================================
    function toggleLike(e, index) {
      e.stopPropagation();
      const btn = e.currentTarget;
      const item = feedItems[index];
      if (typeof toggleFavorite === 'function') {
        const isNowFav = toggleFavorite(item.id);
        btn.classList.toggle('liked', isNowFav);
        btn.querySelector('i').className = isNowFav ? 'fas fa-heart' : 'far fa-heart';
      }
    }

    function viewDetails(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      window.location.href = item._type === 'product' 
        ? `/detail.html?id=${item.id}` 
        : `/service.html?id=${item.id}`;
    }

    function contactSeller(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      const sellerName = item.seller?.name || 'Seller';
      const sellerPhone = item.seller?.phone || '09042339411';
      const cleanNumber = String(sellerPhone).replace(/[^0-9]/g, '');
      
      const waMsg = `Hello ${sellerName}, I saw your ${item._type} "${item.title}" on Zaure Discovery. Is it still available?`;
      const waLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(waMsg)}`;

      // Send to the exact same Google Sheet
      logDiscoveryInteraction(item, sellerName, 'whatsapp_click');

      showToast('Opening WhatsApp...');
      setTimeout(() => { window.open(waLink, '_blank'); }, 150);
    }
  </script>
</body>
</html>
