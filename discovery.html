<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discovery Feed – Zaure</title>
  <meta name="description" content="Discover products and services on Zaure - Nigeria's most trusted online marketplace.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ============================================
       THEME & GLOBAL RESET
       ============================================ */
    :root {
      --navy: #0f2940;
      --navy-2: #1a3650;
      --border: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --surface: #ffffff;
    }

    body {
      background-color: #000;
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      padding: 0 !important;
      margin: 0;
    }

    /* ============================================
       TIKTOK SCROLL CONTAINER
       ============================================ */
    .tiktok-feed {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }
    .tiktok-feed::-webkit-scrollbar { display: none; }

    .feed-item {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================
       IMMERSIVE MEDIA (FIXES ZOOMING)
       ============================================ */
    /* 1. Blurred background that fills the screen */
    .media-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(25px) brightness(0.4);
      transform: scale(1.2); /* Prevent blur edges */
      z-index: 1;
    }

    /* 2. Sharp main image (contained) */
    .media-main {
      position: relative;
      z-index: 2;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Shows full image without zooming */
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border-radius: 12px;
    }

    /* Service Specific Visual (Avatar) */
    .media-service {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .service-avatar-large {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: var(--navy-2);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 4rem; font-weight: 800;
      box-shadow: 0 0 0 8px rgba(26,54,80,0.3), 0 0 0 16px rgba(26,54,80,0.1);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .service-avatar-large img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* ============================================
       UI OVERLAYS
       ============================================ */
    /* Top Bar (Gamification) */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    }
    .top-bar .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .streak-badge {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .streak-badge i { color: #ff9800; animation: fireFlicker 1s infinite alternate; }
    @keyframes fireFlicker { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

    /* Bottom Info (Caption) */
    .bottom-info {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 80px; /* Leave space for right sidebar */
      z-index: 10;
      color: white;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 20px 20px 20px 0;
      pointer-events: none;
    }
    .bottom-info .badge-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      pointer-events: auto;
    }
    .tag {
      background: var(--navy-2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .tag.price {
      background: white;
      color: var(--navy);
      font-size: 0.9rem;
      padding: 4px 14px;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .meta span { display: flex; align-items: center; gap: 4px; }
    .meta i { color: var(--navy-2); background: white; padding: 2px; border-radius: 50%; font-size: 0.6rem; }

    /* Right Action Sidebar */
    .right-actions {
      position: absolute;
      bottom: 30px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .action-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
    .action-btn:active { transform: scale(0.9); }
    .action-btn span {
      font-size: 0.6rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .action-btn.wa { background: #25D366; border-color: #25D366; }
    .action-btn.wa:hover { background: #1DA851; }
    .action-btn.saved { color: #e74c3c; }
    .action-btn.saved i { animation: popHeart 0.4s ease; }

    @keyframes popHeart {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    /* Swipe Up Hint */
    .swipe-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
      animation: bounce 2s infinite;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -10px); }
      60% { transform: translate(-50%, -5px); }
    }

    /* Giant Heart Overlay (Double Tap) */
    .heart-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 100px;
      color: #e74c3c;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .heart-overlay.animate {
      animation: giantHeart 0.8s ease forwards;
    }
    @keyframes giantHeart {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(26,54,80,0.95);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Loading State */
    .loading-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: white;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Feed Container -->
  <div class="tiktok-feed" id="tiktokFeed">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p>Curating your feed...</p>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // ============================================
    // CONFIGURATION & TRACKING
    // ============================================
    const CONFIG = {
      WHATSAPP_NUMBER: '2349042339411',
      // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEBHOOK URL HERE
      SHEET_WEBHOOK_URL: 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'
    };

    let guestDeviceInfo = null;
    let guestGPS = { lat: null, lng: null, maps: null };
    let viewedCount = 0;

    // Collect guest data silently
    async function collectGuestData() {
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            guestGPS = {
              lat: pos.coords.latitude.toFixed(6),
              lng: pos.coords.longitude.toFixed(6),
              maps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
            };
            // Optional: showToast("📍 Location captured for local deals");
          },
          () => { console.log('GPS permission denied'); },
          { timeout: 5000 }
        );
      }

      guestDeviceInfo = {
        userAgent: navigator.userAgent,
        platform: navigator.platform || 'Unknown',
        screen: `${screen.width}x${screen.height}`,
        referrer: document.referrer || 'Direct',
        isGuest: !user
      };
    }
    collectGuestData();

    async function sendToSheet(data) {
      if (!CONFIG.SHEET_WEBHOOK_URL || CONFIG.SHEET_WEBHOOK_URL.includes('YOUR_GOOGLE')) {
        console.warn('⚠️ Sheet Webhook URL not configured. Skipping tracking.');
        return;
      }
      try {
        await fetch(CONFIG.SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error('❌ Tracking failed:', err);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.__toast);
      window.__toast = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ============================================
    // BUILD FEED
    // ============================================
    let feedItems = [];

    document.addEventListener('DOMContentLoaded', async function() {
      const feedContainer = document.getElementById('tiktokFeed');

      // 1. Load Data
      let products = [];
      let services = [];
      try { products = await loadProducts(); } catch(e) {}
      try { services = await loadServices(); } catch(e) {}

      // 2. Normalize
      const pItems = products.map(p => ({ ...p, _type: 'product' }));
      const sItems = services.map(s => {
        const norm = normalizeService(s);
        return {
          id: norm.id,
          title: norm.title,
          price: null, 
          location: norm.location,
          date: norm.date,
          category: norm.category,
          seller: { 
            name: getSellerName(s), 
            phone: s.seller?.phone || s.seller?.whatsapp || '09042339411' 
          },
          _type: 'service',
          _original: s
        };
      });

      // 3. Mix & Shuffle
      feedItems = [...pItems, ...sItems].sort(() => Math.random() - 0.5);

      // 4. Render
      feedContainer.innerHTML = ''; // Clear loader

      if (feedItems.length === 0) {
        feedContainer.innerHTML = `<div class="loading-container"><h2>No items found</h2><p>Be the first to post!</p></div>`;
        return;
      }

      feedItems.forEach((item, index) => {
        feedContainer.appendChild(createFeedItem(item, index));
      });

      // Setup Intersection Observer for "Gamification"
      setupScrollTracking();
    });

    function createFeedItem(item, index) {
      const el = document.createElement('div');
      el.className = 'feed-item';
      el.dataset.id = item.id;
      el.dataset.type = item._type;

      let mediaHtml = '';
      let detailsHtml = '';

      if (item._type === 'product') {
        const img = (item.images && item.images.length > 0) ? item.images[0] : 'https://placehold.co/400x600?text=No+Image';
        const price = item.price >= 1e6 ? `₦${(item.price/1e6).toFixed(1)}M` : `₦${(item.price || 0).toLocaleString()}`;
        
        mediaHtml = `
          <div class="media-bg" style="background-image: url('${img}')"></div>
          <img src="${img}" class="media-main" alt="${item.title}" onerror="this.src='https://placehold.co/400x600?text=No+Image'">
        `;

        detailsHtml = `
          <div class="badge-row">
            <span class="tag price">${price}</span>
            <span class="tag" style="background:white; color:var(--navy);">Product</span>
          </div>
          <div class="title">${item.title}</div>
          <div class="meta">
            <span><i class="fas fa-map-pin"></i> ${item.location || 'Nigeria'}</span>
            <span><i class="fas fa-store"></i> ${item.seller?.name || 'Zaure Official'}</span>
          </div>
        `;
      } else {
        // Service
        const raw = item._original;
        const profilePic = getSellerPic(raw);
        const initials = getSellerInitials(raw);
        const trade = getTradeName(item.category);

        mediaHtml = `
          <div class="media-bg" style="background: linear-gradient(135deg, #1a3650, #0f2940);"></div>
          <div class="media-service">
            <div class="service-avatar-large">
              ${profilePic ? `<img src="${profilePic}">` : initials}
            </div>
          </div>
        `;

        detailsHtml = `
          <div class="badge-row">
            <span class="tag price" style="background:var(--navy-2); color:white;">Available Now</span>
            <span class="tag" style="background:white; color:var(--navy);">${trade}</span>
          </div>
          <div class="title">${item.title}</div>
          <div class="meta">
            <span><i class="fas fa-map-pin"></i> ${item.location || 'Nigeria'}</span>
            <span><i class="fas fa-user-tie"></i> ${item.seller?.name}</span>
          </div>
        `;
      }

      const isFav = typeof isFavorite === 'function' ? isFavorite(item.id) : false;

      el.innerHTML = `
        <!-- Media -->
        ${mediaHtml}

        <!-- Top Bar -->
        <div class="top-bar">
          <a href="/" class="brand"><i class="fas fa-bolt" style="color:#D4B87A;"></i> Zaure</a>
          <div class="streak-badge" id="streakBadge" style="display:none;">
            <i class="fas fa-fire"></i> <span id="streakCount">0</span> viewed
          </div>
        </div>

        <!-- Giant Heart (Hidden by default) -->
        <i class="fas fa-heart heart-overlay" id="heart-${index}"></i>

        <!-- Bottom Info -->
        <div class="bottom-info">
          ${detailsHtml}
        </div>

        <!-- Right Actions -->
        <div class="right-actions">
          <button class="action-btn save-btn ${isFav ? 'saved' : ''}" onclick="toggleSave(event, ${index})">
            <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
            <span>Save</span>
          </button>
          
          <button class="action-btn wa" onclick="contactSeller(event, ${index})">
            <i class="fab fa-whatsapp"></i>
            <span>Chat</span>
          </button>

          <button class="action-btn" onclick="viewDetails(event, ${index})">
            <i class="fas fa-expand"></i>
            <span>View</span>
          </button>
        </div>

        <!-- Swipe Hint -->
        ${index === 0 ? '<div class="swipe-hint" id="swipeHint"><i class="fas fa-chevron-up"></i><span>Swipe up</span></div>' : ''}
      `;

      // Double Tap to Like
      let lastTap = 0;
      const mediaArea = el.querySelector('.media-bg'); // Use BG as the tap target area
      el.addEventListener('click', (e) => {
        // Ignore clicks on buttons
        if (e.target.closest('.action-btn') || e.target.closest('.top-bar')) return;

        const now = Date.now();
        if (now - lastTap < 300) {
          // Double tap detected
          triggerDoubleTapLike(el, index);
          e.preventDefault();
        }
        lastTap = now;
      });

      return el;
    }

    // ============================================
    // ACTIONS & LOGIC
    // ============================================
    function toggleSave(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      const btn = e.currentTarget;
      
      if (typeof toggleFavorite === 'function') {
        if (!getCurrentUser()) { openSignup(); return; }
        const isNowFav = toggleFavorite(item.id);
        if (isNowFav) {
          btn.classList.add('saved');
          btn.innerHTML = `<i class="fas fa-heart"></i><span>Saved</span>`;
          showToast('Saved to favorites!');
        } else {
          btn.classList.remove('saved');
          btn.innerHTML = `<i class="far fa-heart"></i><span>Save</span>`;
        }
      }
    }

    function triggerDoubleTapLike(el, index) {
      const heart = el.querySelector('.heart-overlay');
      const btn = el.querySelector('.save-btn');
      const item = feedItems[index];

      heart.classList.remove('animate');
      void heart.offsetWidth; // Trigger reflow
      heart.classList.add('animate');

      if (typeof isFavorite === 'function' && !isFavorite(item.id)) {
        toggleSave({ currentTarget: btn, stopPropagation: () => {} }, index);
      }
    }

    function viewDetails(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      if (item._type === 'product') {
        window.location.href = `/detail.html?id=${item.id}`;
      } else {
        window.location.href = `/service.html?id=${item.id}`;
      }
    }

    function contactSeller(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      const sellerName = item.seller?.name || 'Seller';
      const sellerPhone = item.seller?.phone || item.seller?.whatsapp || '09042339411';
      const cleanNumber = String(sellerPhone).replace(/[^0-9]/g, '');
      
      const waMsg = `Hello ${sellerName}, I saw your ${item._type} "${item.title}" on Zaure Discovery. Is it still available?`;
      const waLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(waMsg)}`;

      // TRACKING: Send to sheet
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      
      sendToSheet({
        type: 'whatsapp_click_discovery',
        item_type: item._type,
        item_id: item.id,
        item_title: item.title,
        seller_name: sellerName,
        seller_phone: cleanNumber,
        user_name: user ? user.name : 'Guest',
        user_phone: user ? user.phone : 'Not provided',
        user_gps: guestGPS.maps || 'Not provided',
        device_info: guestDeviceInfo,
        timestamp: new Date().toISOString()
      });

      showToast('Opening WhatsApp...');

      // Open link
      setTimeout(() => { window.open(waLink, '_blank'); }, 200);
    }

    // ============================================
    // GAMIFICATION: SCROLL TRACKING
    // ============================================
    function setupScrollTracking() {
      const options = {
        root: document.getElementById('tiktokFeed'),
        threshold: 0.6 // Item must be 60% visible
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            // Hide swipe hint after first item
            const hint = document.getElementById('swipeHint');
            if (hint) hint.style.opacity = '0';

            // Increment gamified counter
            viewedCount++;
            const streakBadge = document.querySelector('.streak-badge'); // Top bar only on first item
            if (streakBadge) {
              streakBadge.style.display = 'flex';
              document.getElementById('streakCount').textContent = viewedCount;
            }
          }
        });
      }, options);

      document.querySelectorAll('.feed-item').forEach(item => {
        observer.observe(item);
      });
    }
  </script>
</body>
</html>
