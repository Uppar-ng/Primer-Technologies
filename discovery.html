<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discovery – Zaure</title>
  <meta name="description" content="Discover products and services on Zaure - Nigeria's most trusted online marketplace.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ============================================
       PREMIUM TIKTOK FEED STYLES
       ============================================ */
    :root {
      --navy: #0f2940;
      --navy-2: #1a3650;
      --surface: #ffffff;
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    body {
      background-color: #000;
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      padding: 0 !important;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* The Vertical Feed Container */
    .tiktok-feed {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tiktok-feed::-webkit-scrollbar { display: none; }

    /* Individual Item */
    .feed-item {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    /* ============================================
       CINEMATIC MEDIA (ZOOMED OUT + BLURRED BG)
       ============================================ */
    .media-carousel {
      position: absolute;
      inset: 0;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      z-index: 1;
    }
    .media-carousel::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* The blurred background that fills the screen */
    .slide-bg {
      position: absolute;
      inset: -20px; /* Prevents blur edges */
      background-size: cover;
      background-position: center;
      filter: blur(25px) brightness(0.3);
      z-index: 1;
    }

    /* The main image - fully visible (zoomed out) */
    .slide-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain; /* Shows full image without cropping */
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
    }

    /* Gradient Overlays */
    .overlay-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 140px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      z-index: 5;
      pointer-events: none;
    }
    .overlay-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 280px;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%);
      z-index: 5;
      pointer-events: none;
    }

    /* Pagination Dots */
    .carousel-dots {
      position: absolute;
      bottom: 190px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.4);
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* ============================================
       TOP BAR
       ============================================ */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      text-decoration: none;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* ============================================
       BOTTOM DETAILS
       ============================================ */
    .bottom-info {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 20px;
      right: 85px; /* Leave room for actions */
      z-index: 10;
    }
    .item-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--navy-2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .badge.price {
      background: #fff;
      color: var(--navy);
      font-size: 1rem;
      padding: 5px 16px;
      letter-spacing: 0;
    }
    .item-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .item-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .item-meta span { display: flex; align-items: center; gap: 5px; }

    /* ============================================
       RIGHT ACTION SIDEBAR
       ============================================ */
    .action-sidebar {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .action-btn {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .action-btn:active { transform: scale(0.85); }
    
    /* Button Labels */
    .action-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }

    /* Like Button State */
    .action-btn.liked {
      color: #ff2d55;
      border-color: #ff2d55;
      background: rgba(255, 45, 85, 0.15);
    }
    .action-btn.liked i { animation: popHeartBtn 0.4s ease; }

    /* WhatsApp Button */
    .action-btn.wa {
      background: linear-gradient(135deg, #25D366, #1DA851);
      border: none;
    }
    
    /* Store Button */
    .action-btn.store {
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      color: var(--navy);
    }

    /* ============================================
       GIANT DOUBLE-TAP HEART
       ============================================ */
    .giant-heart {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 140px;
      color: #ff2d55;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 0 30px rgba(255,45,85,0.6));
    }
    .giant-heart.animate {
      animation: heartBurst 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(0.9) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
    }

    @keyframes popHeartBtn {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    /* Swipe Up Hint */
    .swipe-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
      animation: bounce 2s infinite;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -8px); }
      60% { transform: translate(-50%, -4px); }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(26,54,80,0.95);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Loader */
    .loader {
      height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: white;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <div class="tiktok-feed" id="tiktokFeed">
    <div class="loader">
      <div class="spinner"></div>
      <p>Curating your feed...</p>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // ============================================
    // TRACKING & SETUP
    // ============================================
    const CONFIG = {
      WHATSAPP_NUMBER: '2349042339411',
      SHEET_WEBHOOK_URL: 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'
    };

    let guestDeviceInfo = null;
    let guestGPS = { lat: null, lng: null, maps: null };

    // 1. Collect Guest Data
    (async function collectGuestData() {
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            guestGPS = {
              lat: pos.coords.latitude.toFixed(6),
              lng: pos.coords.longitude.toFixed(6),
              maps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
            };
          },
          () => {},
          { timeout: 5000 }
        );
      }
      guestDeviceInfo = {
        userAgent: navigator.userAgent,
        platform: navigator.platform || 'Unknown',
        screen: `${screen.width}x${screen.height}`,
        isGuest: !user
      };
    })();

    // 2. Send Tracking
    async function sendToSheet(data) {
      if (!CONFIG.SHEET_WEBHOOK_URL || CONFIG.SHEET_WEBHOOK_URL.includes('YOUR_GOOGLE')) return;
      try {
        await fetch(CONFIG.SHEET_WEBHOOK_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.__toast);
      window.__toast = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ============================================
    // BUILD FEED
    // ============================================
    let feedItems = [];

    document.addEventListener('DOMContentLoaded', async function() {
      const feedContainer = document.getElementById('tiktokFeed');

      let products = [];
      let services = [];
      try { products = await loadProducts(); } catch(e) {}
      try { services = await loadServices(); } catch(e) {}

      // Prepare Products
      const pItems = products.map(p => ({ ...p, _type: 'product' }));
      
      // Prepare Services
      const sItems = services.map(s => {
        const norm = normalizeService(s);
        return {
          id: norm.id,
          title: norm.title,
          price: null, 
          location: norm.location,
          category: norm.category,
          seller: { 
            name: getSellerName(s), 
            phone: s.seller?.phone || s.seller?.whatsapp || '09042339411' 
          },
          _type: 'service',
          _original: s
        };
      });

      // Shuffle
      feedItems = [...pItems, ...sItems].sort(() => Math.random() - 0.5);
      feedContainer.innerHTML = '';

      if (feedItems.length === 0) {
        feedContainer.innerHTML = `<div class="loader"><h2>No items found</h2></div>`;
        return;
      }

      // Render all items
      feedItems.forEach((item, index) => {
        feedContainer.appendChild(createFeedItem(item, index));
      });
    });

    function createFeedItem(item, index) {
      const el = document.createElement('div');
      el.className = 'feed-item';
      
      // --- 1. Build Media Carousel ---
      let slidesHtml = '';
      let dotsHtml = '';
      
      if (item._type === 'product') {
        const images = (item.images && item.images.length > 0) ? item.images : ['https://placehold.co/400x600?text=No+Image'];
        
        images.forEach((img, i) => {
          slidesHtml += `
            <div class="carousel-slide">
              <div class="slide-bg" style="background-image: url('${img}')"></div>
              <img src="${img}" alt="${item.title}" class="slide-img" loading="${i === 0 ? 'eager' : 'lazy'}" onerror="this.src='https://placehold.co/400x600?text=No+Image'">
            </div>
          `;
          dotsHtml += `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
        });
      } else {
        // Service Media (Avatar)
        const raw = item._original;
        const profilePic = getSellerPic(raw);
        const initials = getSellerInitials(raw);
        
        let avatarContent = profilePic 
          ? `<img src="${profilePic}" style="width:100%; height:100%; object-fit:cover;">` 
          : `<span style="font-size:5rem; font-weight:800; color:var(--navy-2);">${initials}</span>`;
        
        slidesHtml = `
          <div class="carousel-slide">
            <div class="slide-bg" style="background: linear-gradient(135deg, var(--navy-2), var(--navy));"></div>
            <div style="position:relative; z-index:2; width:220px; height:220px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 0 10px rgba(255,255,255,0.1), 0 0 0 20px rgba(255,255,255,0.05); overflow:hidden;">
              ${avatarContent}
            </div>
          </div>
        `;
      }

      // --- 2. Build Details ---
      let badgesHtml = '';
      if (item._type === 'product') {
        const price = item.price >= 1e6 ? `₦${(item.price/1e6).toFixed(1)}M` : `₦${(item.price || 0).toLocaleString()}`;
        badgesHtml = `
          <span class="badge price">${price}</span>
          <span class="badge">Product</span>
        `;
      } else {
        const trade = getTradeName(item.category);
        badgesHtml = `
          <span class="badge price" style="background:var(--navy-2); color:#fff;">Available Now</span>
          <span class="badge">${trade}</span>
        `;
      }

      const isFav = typeof isFavorite === 'function' ? isFavorite(item.id) : false;
      const sellerName = item.seller?.name || 'Zaure Official';
      
      // --- 3. Store Button Logic ---
      // If it's a product and has a seller ID (or name we can use), show Store button. Otherwise, it just goes to Details.
      const hasStore = item._type === 'product' && (item.seller && (item.seller.id || item.seller.name));
      const storeBtnHtml = hasStore ? `
        <div class="action-btn-wrapper">
          <button class="action-btn store" onclick="goToStore(event, ${index})">
            <i class="fas fa-store"></i>
          </button>
          <span class="action-label">Store</span>
        </div>
      ` : '';

      el.innerHTML = `
        <div class="overlay-top"></div>
        <div class="overlay-bottom"></div>

        <div class="media-carousel">
          ${slidesHtml}
        </div>

        ${dotsHtml ? `<div class="carousel-dots">${dotsHtml}</div>` : ''}

        <i class="fas fa-heart giant-heart" id="heart-${index}"></i>

        <div class="top-bar">
          <a href="/" class="brand"><i class="fas fa-bolt" style="color:#D4B87A;"></i> Zaure</a>
        </div>

        <div class="bottom-info">
          <div class="item-badges">${badgesHtml}</div>
          <div class="item-title">${item.title}</div>
          <div class="item-meta">
            <span><i class="fas fa-map-pin"></i> ${item.location || 'Nigeria'}</span>
            <span><i class="fas ${item._type === 'product' ? 'fa-store' : 'fa-user-tie'}"></i> ${sellerName}</span>
          </div>
        </div>

        <div class="action-sidebar">
          <div class="action-btn-wrapper">
            <button class="action-btn like-btn ${isFav ? 'liked' : ''}" onclick="toggleLike(event, ${index})">
              <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
            </button>
            <span class="action-label">Like</span>
          </div>
          
          <div class="action-btn-wrapper">
            <button class="action-btn wa" onclick="contactSeller(event, ${index})">
              <i class="fab fa-whatsapp"></i>
            </button>
            <span class="action-label">Chat</span>
          </div>

          ${storeBtnHtml}

          <div class="action-btn-wrapper">
            <button class="action-btn" onclick="viewDetails(event, ${index})">
              <i class="fas fa-info-circle"></i>
            </button>
            <span class="action-label">Details</span>
          </div>
        </div>

        ${index === 0 ? '<div class="swipe-hint" id="swipeHint"><i class="fas fa-chevron-up"></i><span>Swipe up</span></div>' : ''}
      `;

      setupDoubleTap(el, index);
      setupCarouselScroll(el);

      return el;
    }

    // ============================================
    // CAROUSEL SCROLL LOGIC
    // ============================================
    function setupCarouselScroll(itemEl) {
      const carousel = itemEl.querySelector('.media-carousel');
      const dots = itemEl.querySelectorAll('.dot');
      
      if (!carousel || dots.length <= 1) return;

      carousel.addEventListener('scroll', () => {
        const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });
      });
    }

    // ============================================
    // DOUBLE TAP TO LIKE LOGIC
    // ============================================
    function setupDoubleTap(el, index) {
      let lastTap = 0;
      const tapArea = el.querySelector('.media-carousel');

      tapArea.addEventListener('click', (e) => {
        const now = Date.now();
        const DOUBLE_PRESS_DELAY = 300;
        
        if (now - lastTap < DOUBLE_PRESS_DELAY) {
          triggerDoubleTapLike(el, index, e);
          e.preventDefault();
        }
        lastTap = now;
      });
    }

    function triggerDoubleTapLike(el, index, event) {
      const heart = el.querySelector('.giant-heart');
      const likeBtn = el.querySelector('.like-btn');
      const item = feedItems[index];

      heart.classList.remove('animate');
      void heart.offsetWidth; 
      heart.classList.add('animate');

      const icon = likeBtn.querySelector('i');
      if (!likeBtn.classList.contains('liked')) {
        likeBtn.classList.add('liked');
        icon.className = 'fas fa-heart';
        
        if (typeof toggleFavorite === 'function') {
          if (!getCurrentUser()) { 
             // Guest can double tap to see animation, but doesn't save to DB
          } else {
             toggleFavorite(item.id);
          }
        }
      }
    }

    // ============================================
    // BUTTON ACTIONS
    // ============================================
    function toggleLike(e, index) {
      e.stopPropagation();
      const btn = e.currentTarget;
      const item = feedItems[index];
      
      if (typeof getCurrentUser === 'function' && !getCurrentUser()) {
        if (typeof openSignup === 'function') openSignup();
        return;
      }

      if (typeof toggleFavorite === 'function') {
        const isNowFav = toggleFavorite(item.id);
        const icon = btn.querySelector('i');
        
        if (isNowFav) {
          btn.classList.add('liked');
          icon.className = 'fas fa-heart';
        } else {
          btn.classList.remove('liked');
          icon.className = 'far fa-heart';
        }
      }
    }

    function goToStore(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      
      // If product has a specific store ID, go there
      if (item.seller && item.seller.id) {
        window.location.href = `/store.html?id=${item.seller.id}`;
      } 
      // Fallback: If no ID but has a name, go to stores directory (or detail)
      else if (item.seller && item.seller.name) {
        window.location.href = `/stores.html?search=${encodeURIComponent(item.seller.name)}`;
      } 
      else {
        window.location.href = `/detail.html?id=${item.id}`;
      }
    }

    function viewDetails(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      window.location.href = item._type === 'product' 
        ? `/detail.html?id=${item.id}` 
        : `/service.html?id=${item.id}`;
    }

    function contactSeller(e, index) {
      e.stopPropagation();
      const item = feedItems[index];
      const sellerName = item.seller?.name || 'Seller';
      const sellerPhone = item.seller?.phone || '09042339411';
      const cleanNumber = String(sellerPhone).replace(/[^0-9]/g, '');
      
      const waMsg = `Hello ${sellerName}, I saw your ${item._type} "${item.title}" on Zaure Discovery. Is it still available?`;
      const waLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(waMsg)}`;

      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      sendToSheet({
        type: 'whatsapp_click_discovery',
        item_type: item._type,
        item_id: item.id,
        item_title: item.title,
        seller_name: sellerName,
        seller_phone: cleanNumber,
        user_name: user ? user.name : 'Guest',
        user_phone: user ? user.phone : 'Not provided',
        user_gps: guestGPS.maps || 'Not provided',
        device_info: guestDeviceInfo,
        timestamp: new Date().toISOString()
      });

      showToast('Opening WhatsApp...');
      setTimeout(() => { window.open(waLink, '_blank'); }, 150);
    }
  </script>
</body>
</html>
