<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discover – Zaure</title>
  <meta name="description" content="Swipe through products near you on Zaure.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       STAGE — full screen on mobile, phone-frame on desktop
       ============================================================ */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      body {
        background:
          radial-gradient(circle at 50% 20%, #1a3650 0%, #0f2940 45%, #000 100%);
      }
      .stage {
        width: 420px;
        height: 88vh;
        max-height: 860px;
        border-radius: 32px;
        box-shadow:
          0 60px 120px rgba(0,0,0,0.7),
          0 0 0 8px rgba(255,255,255,0.06),
          0 0 0 1px rgba(255,255,255,0.12);
      }
    }

    /* ============================================================
       TOP BAR
       ============================================================ */
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: calc(14px + env(safe-area-inset-top)) 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, transparent 100%);
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }

    .back-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }
    .back-btn:hover { background: rgba(0,0,0,0.7); transform: scale(1.05); }
    .back-btn:active { transform: scale(0.95); }

    .loc-toggle {
      display: flex;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 40px;
      padding: 4px;
      gap: 2px;
    }
    .loc-toggle button {
      padding: 7px 14px;
      border-radius: 30px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.7);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .loc-toggle button.active {
      background: linear-gradient(135deg, #D4B87A, #B49450);
      color: #1a2c3d;
      box-shadow: 0 2px 8px rgba(212,184,122,0.4);
    }

    /* ============================================================
       REELS CONTAINER (vertical scroll)
       ============================================================ */
    .reels {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .reels::-webkit-scrollbar { display: none; }

    .slide {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #000;
    }

    /* ============================================================
       IMAGE TRACK (horizontal scroll per slide)
       ============================================================ */
    .slide-images {
      position: absolute;
      inset: 0;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .slide-images::-webkit-scrollbar { display: none; }

    .slide-image {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
    }
    .slide-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Placeholder for products without images */
    .slide-image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background:
        radial-gradient(circle at 30% 30%, rgba(212,184,122,0.15) 0%, transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(47,111,158,0.2) 0%, transparent 60%),
        linear-gradient(135deg, #1a3650 0%, #0f2940 100%);
    }
    .slide-image-placeholder i {
      font-size: 4rem;
      color: rgba(212,184,122,0.6);
    }
    .slide-image-placeholder span {
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Gradient overlay for readability */
    .slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0) 18%,
        rgba(0,0,0,0) 42%,
        rgba(0,0,0,0.72) 78%,
        rgba(0,0,0,0.94) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ============================================================
       IMAGE DOTS
       ============================================================ */
    .image-dots {
      position: absolute;
      top: calc(62px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 15;
      padding: 6px 10px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .image-dots .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: all 0.3s;
      cursor: pointer;
    }
    .image-dots .dot.active {
      background: #D4B87A;
      width: 22px;
      border-radius: 3px;
    }

    /* ============================================================
       PRODUCT INFO (bottom-left)
       ============================================================ */
    .product-info {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 16px;
      right: 88px;
      z-index: 10;
      color: #fff;
    }

    .product-badges {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .p-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .p-badge.featured {
      background: linear-gradient(135deg, #D4B87A, #B49450);
      color: #1a2c3d;
    }
    .p-badge.boosted {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .product-price {
      font-size: 1.65rem;
      font-weight: 800;
      color: #D4B87A;
      letter-spacing: -0.6px;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      line-height: 1.1;
    }
    .product-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.88);
      margin-bottom: 12px;
    }
    .product-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .product-meta i {
      color: #D4B87A;
      font-size: 0.7rem;
    }

    .product-seller {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 6px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 40px;
      width: fit-content;
      max-width: 100%;
    }
    .seller-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D4B87A, #B49450);
      color: #1a2c3d;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }
    .seller-avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .seller-info { min-width: 0; }
    .seller-name {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .seller-verified {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 1px;
    }
    .seller-verified i {
      color: #4ade80;
      font-size: 0.6rem;
    }

    /* ============================================================
       ACTION BUTTONS (right side)
       ============================================================ */
    .product-actions {
      position: absolute;
      right: 12px;
      bottom: calc(100px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      transition: transform 0.2s;
      text-decoration: none;
    }
    .action-btn:active { transform: scale(0.9); }

    .action-circle {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: all 0.2s;
    }
    .action-btn:hover .action-circle {
      background: rgba(0,0,0,0.65);
      transform: scale(1.08);
    }
    .action-circle.whatsapp {
      background: linear-gradient(135deg, #25D366, #1DA851);
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(37,211,102,0.45);
      animation: waGlow 2.5s ease-in-out infinite;
    }
    @keyframes waGlow {
      0%, 100% { box-shadow: 0 6px 20px rgba(37,211,102,0.45); }
      50% { box-shadow: 0 6px 28px rgba(37,211,102,0.75); }
    }
    .action-circle.view {
      background: linear-gradient(135deg, #D4B87A, #B49450);
      color: #1a2c3d;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(212,184,122,0.45);
    }
    .action-circle.faved {
      background: linear-gradient(135deg, #e63946, #c1121f);
      border-color: transparent;
    }
    .action-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }

    /* ============================================================
       PROGRESS BAR (very bottom)
       ============================================================ */
    .progress-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.08);
      z-index: 30;
      pointer-events: none;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #D4B87A, #B49450);
      transition: width 0.2s ease;
      border-radius: 0 3px 3px 0;
    }

    /* ============================================================
       SWIPE HINT (first slide only)
       ============================================================ */
    .swipe-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #fff;
      pointer-events: none;
      animation: swipeHintFade 5s ease forwards;
    }
    .swipe-hint .arrow {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      animation: swipeHintBounce 1.6s ease infinite;
    }
    .swipe-hint span {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    @keyframes swipeHintFade {
      0%, 55% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    @keyframes swipeHintBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ============================================================
       STATE OVERLAY (loading / empty)
       ============================================================ */
    .state-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      padding: 40px 24px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 40%, #1a3650 0%, #0f2940 50%, #000 100%);
    }
    .state-overlay i.state-icon {
      font-size: 3rem;
      color: #D4B87A;
      opacity: 0.85;
    }
    .state-overlay h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .state-overlay p {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      max-width: 300px;
    }
    .state-overlay button {
      padding: 12px 28px;
      border-radius: 60px;
      border: none;
      background: linear-gradient(135deg, #D4B87A, #B49450);
      color: #1a2c3d;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 8px 24px rgba(212,184,122,0.35);
      transition: transform 0.2s;
    }
    .state-overlay button:hover { transform: translateY(-2px); }
    .state-overlay button i { margin-right: 6px; }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15,41,64,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.12);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <!-- Top bar -->
    <div class="topbar">
      <a href="/" class="back-btn" aria-label="Back to home">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="loc-toggle" id="locToggle">
        <button data-filter="near" class="active">Near you</button>
        <button data-filter="all">All Nigeria</button>
      </div>
    </div>

    <!-- Reels scroll container -->
    <div class="reels" id="reelsContainer">
      <!-- Slides injected by JS -->
    </div>

    <!-- Progress bar -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/main.js"></script>
  <script>
  (function () {
    'use strict';

    // ============================================================
    // STATE
    // ============================================================
    let allProducts = [];
    let displayProducts = [];
    let currentFilter = 'near';
    let userState = null;
    let slideObserver = null;
    let currentSlideIndex = 0;

    // ============================================================
    // HELPERS
    // ============================================================
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatPrice(price) {
      if (!price && price !== 0) return 'Contact';
      const n = Number(price);
      if (isNaN(n) || n === 0) return 'Contact';
      if (n >= 1e6) return '₦' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      return '₦' + n.toLocaleString();
    }

    function getInitials(name) {
      const parts = String(name || '?').trim().split(/\s+/);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function getCategoryIcon(cat) {
      const map = {
        'electronics': 'laptop',
        'fashion': 'tshirt',
        'beauty-health': 'spa',
        'food-drinks': 'utensils',
        'home-kitchen': 'couch',
        'vehicles': 'car',
        'real-estate': 'home',
        'furniture': 'couch',
        'services': 'tools'
      };
      return map[cat] || 'box';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(() => t.classList.remove('show'), 2400);
    }

    function buildWhatsAppLink(product) {
      const raw = product.seller?.whatsapp || product.seller?.phone || '';
      const digits = String(raw).replace(/\D/g, '');
      if (!digits) return '';
      // Ensure Nigerian country code
      let num = digits;
      if (num.startsWith('0')) num = '234' + num.slice(1);
      else if (!num.startsWith('234') && num.length === 10) num = '234' + num;
      else if (!num.startsWith('234') && num.length > 10) num = '234' + num.replace(/^234/, '');
      if (num.startsWith('234234')) num = num.slice(3);
      const msg = encodeURIComponent(`Hi, I saw your listing "${product.title}" on Zaure. Is it still available?`);
      return `https://wa.me/${num}?text=${msg}`;
    }

    // ============================================================
    // FILTERING
    // ============================================================
    function filterByLocation(products, state) {
      if (!state) return [];
      const s = state.toLowerCase().trim();
      return products.filter(p => {
        if (!p.location) return false;
        return p.location.toLowerCase().includes(s);
      });
    }

    function refreshDisplay() {
      if (currentFilter === 'near' && userState) {
        const near = filterByLocation(allProducts, userState);
        if (near.length > 0) {
          displayProducts = near;
          return;
        }
        // No results near — fall back gracefully and flip the toggle
        currentFilter = 'all';
        document.querySelectorAll('.loc-toggle button').forEach(b => {
          b.classList.toggle('active', b.dataset.filter === 'all');
        });
      }
      displayProducts = [...allProducts];
    }

    // ============================================================
    // BUILD SLIDES
    // ============================================================
    function buildSlide(product, index) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.index = String(index);
      slide.dataset.productId = product.id;

      const images = (product.images || []).filter(Boolean);
      const hasMultiple = images.length > 1;

      // Image track (horizontal)
      const track = document.createElement('div');
      track.className = 'slide-images';

      if (images.length === 0) {
        const ph = document.createElement('div');
        ph.className = 'slide-image-placeholder';
        ph.innerHTML = `
          <i class="fas fa-${getCategoryIcon(product.category)}"></i>
          <span>${escapeHtml(product.category || 'Product')}</span>
        `;
        track.appendChild(ph);
      } else {
        images.forEach((url, i) => {
          const wrap = document.createElement('div');
          wrap.className = 'slide-image';
          const img = document.createElement('img');
          img.src = url;
          img.alt = product.title || 'Product image';
          img.loading = index < 3 ? 'eager' : 'lazy';
          img.draggable = false;
          wrap.appendChild(img);
          track.appendChild(wrap);
        });
      }

      slide.appendChild(track);

      // Image dots
      if (hasMultiple) {
        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'image-dots';
        images.forEach((_, i) => {
          const d = document.createElement('span');
          d.className = 'dot' + (i === 0 ? ' active' : '');
          d.dataset.index = i;
          d.addEventListener('click', () => {
            track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
          });
          dotsWrap.appendChild(d);
        });
        slide.appendChild(dotsWrap);

        // Update dots on horizontal scroll
        let scrollRaf = null;
        track.addEventListener('scroll', () => {
          if (scrollRaf) return;
          scrollRaf = requestAnimationFrame(() => {
            scrollRaf = null;
            const idx = Math.round(track.scrollLeft / track.clientWidth);
            dotsWrap.querySelectorAll('.dot').forEach((d, i) => {
              d.classList.toggle('active', i === idx);
            });
          });
        }, { passive: true });
      }

      // Product info
      const info = document.createElement('div');
      info.className = 'product-info';

      const badges = [];
      if (product.featured) badges.push('<span class="p-badge featured">⭐ Featured</span>');
      if (product.boosted) badges.push('<span class="p-badge boosted"><i class="fas fa-bolt"></i> Boosted</span>');

      const sellerName = product.seller?.name || 'Zaure Seller';
      const sellerInitials = product.seller?.initials || getInitials(sellerName);
      const sellerPic = product.seller?.profilePic || product.seller?.avatar || '';
      const verified = product.seller?.verified;

      info.innerHTML = `
        ${badges.length > 0 ? `<div class="product-badges">${badges.join('')}</div>` : ''}
        <div class="product-price">${formatPrice(product.price)}</div>
        <div class="product-title">${escapeHtml(product.title)}</div>
        <div class="product-meta">
          <span><i class="fas fa-map-pin"></i> ${escapeHtml(product.location || 'Nigeria')}</span>
          <span><i class="far fa-clock"></i> ${escapeHtml(product.date || '')}</span>
        </div>
        <div class="product-seller">
          <div class="seller-avatar">
            ${sellerPic
              ? `<img src="${escapeHtml(sellerPic)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${sellerInitials}'">`
              : sellerInitials}
          </div>
          <div class="seller-info">
            <div class="seller-name">${escapeHtml(sellerName)}</div>
            ${verified ? '<div class="seller-verified"><i class="fas fa-check-circle"></i> Verified</div>' : ''}
          </div>
        </div>
      `;
      slide.appendChild(info);

      // Action buttons
      const actions = document.createElement('div');
      actions.className = 'product-actions';

      const isFav = typeof isFavorite === 'function' ? isFavorite(product.id) : false;
      const favCircleClass = isFav ? 'action-circle faved' : 'action-circle';
      const favIcon = isFav ? 'fas fa-heart' : 'far fa-heart';
      const favLabel = isFav ? 'Saved' : 'Save';

      const waLink = buildWhatsAppLink(product);

      actions.innerHTML = `
        <button type="button" class="action-btn" data-action="fav" data-product-id="${escapeHtml(product.id)}">
          <div class="${favCircleClass}"><i class="${favIcon}"></i></div>
          <span class="action-label">${favLabel}</span>
        </button>
        ${waLink ? `
        <a href="${waLink}" target="_blank" rel="noopener" class="action-btn" data-action="wa">
          <div class="action-circle whatsapp"><i class="fab fa-whatsapp"></i></div>
          <span class="action-label">Chat</span>
        </a>` : ''}
        <button type="button" class="action-btn" data-action="share" data-product-id="${escapeHtml(product.id)}" data-title="${escapeHtml(product.title)}">
          <div class="action-circle"><i class="fas fa-share-alt"></i></div>
          <span class="action-label">Share</span>
        </button>
        <button type="button" class="action-btn" data-action="view" data-product-id="${escapeHtml(product.id)}">
          <div class="action-circle view"><i class="fas fa-shopping-bag"></i></div>
          <span class="action-label">View</span>
        </button>
      `;
      slide.appendChild(actions);

      // Wire actions
      actions.querySelector('[data-action="fav"]')?.addEventListener('click', function (e) {
        e.stopPropagation();
        if (typeof getCurrentUser === 'function' && !getCurrentUser()) {
          if (typeof openSignup === 'function') openSignup();
          return;
        }
        const pid = this.dataset.productId;
        const nowFav = typeof toggleFavorite === 'function' ? toggleFavorite(pid) : false;
        const circle = this.querySelector('.action-circle');
        const icon = circle.querySelector('i');
        const label = this.querySelector('.action-label');
        if (nowFav) {
          circle.classList.add('faved');
          icon.className = 'fas fa-heart';
          label.textContent = 'Saved';
          showToast('Saved to favorites');
        } else {
          circle.classList.remove('faved');
          icon.className = 'far fa-heart';
          label.textContent = 'Save';
        }
      });

      actions.querySelector('[data-action="view"]')?.addEventListener('click', function () {
        window.location.href = `/detail.html?id=${encodeURIComponent(this.dataset.productId)}`;
      });

      actions.querySelector('[data-action="share"]')?.addEventListener('click', async function () {
        const pid = this.dataset.productId;
        const title = this.dataset.title || 'Zaure Listing';
        const url = `${window.location.origin}/detail.html?id=${encodeURIComponent(pid)}`;
        if (navigator.share) {
          try { await navigator.share({ title, url }); }
          catch (e) { /* user cancelled */ }
        } else {
          try {
            await navigator.clipboard.writeText(url);
            showToast('Link copied to clipboard');
          } catch {
            showToast('Could not share');
          }
        }
      });

      return slide;
    }

    // ============================================================
    // RENDER ALL
    // ============================================================
    function render() {
      const container = document.getElementById('reelsContainer');
      container.innerHTML = '';

      if (displayProducts.length === 0) {
        container.innerHTML = `
          <div class="state-overlay">
            <i class="fas fa-box-open state-icon"></i>
            <h2>Nothing to discover yet</h2>
            <p>${currentFilter === 'near' && userState
              ? `No listings near ${escapeHtml(userState)} right now. Try switching to "All Nigeria".`
              : 'There are no listings yet. Come back soon.'}</p>
            <button onclick="window.location.href='/'">
              <i class="fas fa-home"></i> Go Home
            </button>
          </div>
        `;
        document.getElementById('progressFill').style.width = '0%';
        return;
      }

      // Build all slides
      displayProducts.forEach((p, i) => {
        container.appendChild(buildSlide(p, i));
      });

      // Show swipe hint on first slide only
      if (displayProducts.length > 1) {
        const firstSlide = container.querySelector('.slide');
        const hint = document.createElement('div');
        hint.className = 'swipe-hint';
        hint.innerHTML = `
          <div class="arrow"><i class="fas fa-chevron-up"></i></div>
          <span>Swipe up</span>
        `;
        firstSlide.appendChild(hint);
      }

      // Track active slide via IntersectionObserver
      if (slideObserver) slideObserver.disconnect();
      slideObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
            const idx = parseInt(entry.target.dataset.index, 10);
            currentSlideIndex = idx;
            updateProgress(idx, displayProducts.length);
          }
        });
      }, { threshold: [0.5], root: container });

      container.querySelectorAll('.slide').forEach(s => slideObserver.observe(s));

      // Reset progress bar on fresh render
      updateProgress(0, displayProducts.length);

      // Reset scroll position
      container.scrollTop = 0;
    }

    function updateProgress(index, total) {
      if (total <= 0) return;
      const pct = ((index + 1) / total) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    // ============================================================
    // FILTER TOGGLE
    // ============================================================
    function wireToggle() {
      const toggle = document.getElementById('locToggle');
      if (!toggle) return;
      toggle.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.filter === currentFilter) return;
          currentFilter = btn.dataset.filter;
          toggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          refreshDisplay();
          render();
        });
      });
    }

    // ============================================================
    // KEYBOARD NAVIGATION (desktop)
    // ============================================================
    function wireKeyboard() {
      const container = document.getElementById('reelsContainer');
      document.addEventListener('keydown', e => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault();
          container.scrollBy({ top: container.clientHeight, behavior: 'smooth' });
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          container.scrollBy({ top: -container.clientHeight, behavior: 'smooth' });
        } else if (e.key === 'ArrowLeft') {
          const slide = container.querySelectorAll('.slide')[currentSlideIndex];
          const track = slide?.querySelector('.slide-images');
          if (track) track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
        } else if (e.key === 'ArrowRight') {
          const slide = container.querySelectorAll('.slide')[currentSlideIndex];
          const track = slide?.querySelector('.slide-images');
          if (track) track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
        }
      });
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      // Get user state
      if (typeof getCurrentUser === 'function') {
        const user = getCurrentUser();
        if (user && user.state) userState = user.state;
      }

      // Show loading
      const container = document.getElementById('reelsContainer');
      container.innerHTML = `
        <div class="state-overlay">
          <i class="fas fa-spinner fa-spin state-icon"></i>
          <h2>Loading…</h2>
          <p>Finding the best products near you.</p>
        </div>
      `;

      // Load products
      try {
        if (typeof loadProducts === 'function') {
          allProducts = await loadProducts();
        }
        if (!Array.isArray(allProducts)) allProducts = [];
      } catch (e) {
        console.warn('Could not load products', e);
        allProducts = [];
      }

      // Filter for products that have at least a title (skip broken entries)
      allProducts = allProducts.filter(p => p && p.id && p.title);

      // If no user state, force "All Nigeria" mode from the start
      if (!userState) {
        currentFilter = 'all';
        const toggle = document.getElementById('locToggle');
        if (toggle) {
          toggle.querySelectorAll('button').forEach(b => {
            b.classList.toggle('active', b.dataset.filter === 'all');
          });
        }
      }

      refreshDisplay();

      // Load theme
      if (typeof initTheme === 'function') initTheme();
      if (typeof updateFavoriteBadge === 'function') updateFavoriteBadge();

      // Render
      render();
      wireToggle();
      wireKeyboard();
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
