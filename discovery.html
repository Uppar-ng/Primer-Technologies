<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discovery – Zaure</title>
  <meta name="description" content="Discover products and services on Zaure - Nigeria's most trusted online marketplace.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ============================================
       THEME & GLOBAL RESET
       ============================================ */
    :root {
      --navy: #0f2940;
      --navy-2: #1a3650;
      --border: #e5ecf3;
      --text: #0f2940;
      --text-secondary: #64748b;
      --surface: #ffffff;
      --surface-alt: #f8fbfe;
    }

    body {
      background-color: var(--navy); /* Dark background for the feed */
      color: var(--surface);
      overflow: hidden; /* Prevent body scroll, rely on internal container */
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 0; /* Override main.css if it forces padding */
    }

    /* Hide default scrollbars */
    ::-webkit-scrollbar { display: none; }

    /* ============================================
       NAVBAR (Minimal for Discovery)
       ============================================ */
    .discovery-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(180deg, rgba(15,41,64,0.8) 0%, transparent 100%);
      pointer-events: none; /* Let clicks pass through to cards */
    }
    .discovery-nav a, .discovery-nav button {
      pointer-events: auto;
    }
    .discovery-nav .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      text-decoration: none;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .discovery-nav .brand i {
      color: var(--navy-2); /* Since bg is dark, use a lighter navy or white */
      font-size: 1.2rem;
    }
    .discovery-nav .nav-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .discovery-nav .nav-btn:hover { background: rgba(255,255,255,0.2); }

    /* ============================================
       SWIPE FEED CONTAINER
       ============================================ */
    .feed-container {
      flex: 1;
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      perspective: 1000px;
    }

    /* Individual Card */
    .feed-card {
      position: absolute;
      top: 16px; left: 16px; right: 16px; bottom: 90px;
      background: var(--surface);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
      transform-origin: bottom center;
      will-change: transform;
      z-index: 1;
    }

    /* Stacking Effect */
    .feed-card[data-index="0"] { z-index: 10; opacity: 1; transform: scale(1) translateY(0); }
    .feed-card[data-index="1"] { z-index: 9; opacity: 0.8; transform: scale(0.95) translateY(15px); }
    .feed-card[data-index="2"] { z-index: 8; opacity: 0.5; transform: scale(0.9) translateY(30px); }
    .feed-card[data-index="3"] { z-index: 7; opacity: 0.2; transform: scale(0.85) translateY(45px); }
    .feed-card[data-index="4"] { z-index: 6; opacity: 0; transform: scale(0.8) translateY(60px); }
    .feed-card[data-index="5"] { z-index: 5; opacity: 0; }
    .feed-card[data-index="6"] { z-index: 4; opacity: 0; }
    .feed-card[data-index="7"] { z-index: 3; opacity: 0; }
    .feed-card[data-index="8"] { z-index: 2; opacity: 0; }
    .feed-card[data-index="9"] { z-index: 1; opacity: 0; }

    /* Swipe Away Animations */
    .feed-card.swipe-left {
      transform: translateX(-150%) rotate(-20deg) !important;
      opacity: 0 !important;
    }
    .feed-card.swipe-right {
      transform: translateX(150%) rotate(20deg) !important;
      opacity: 0 !important;
    }

    /* ============================================
       CARD CONTENT
       ============================================ */
    /* Image Section (Top Half) */
    .card-image-area {
      position: relative;
      flex: 1;
      background: #0a1622; /* Very dark blue/black for contain letterboxing */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    .card-image-area img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* KEY FIX: Shows full image without zooming */
    }
    /* Service Avatar specific */
    .card-image-area.is-service {
      background: linear-gradient(135deg, var(--navy-2), var(--navy));
    }
    .card-image-area.is-service .service-avatar {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: white;
      overflow: hidden;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.1), 0 0 0 10px rgba(255,255,255,0.05);
      position: relative;
      z-index: 2;
    }
    .card-image-area.is-service .service-avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .card-image-area.is-service .service-avatar span {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; font-size: 3rem; font-weight: 800; color: var(--navy-2);
    }

    /* Top Badge */
    .card-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--navy-2);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Gradient Overlay at bottom of image */
    .card-image-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(0deg, var(--surface) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Details Section (Bottom Half) */
    .card-details {
      padding: 12px 20px 20px;
      background: var(--surface);
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
    }
    .item-trade {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--navy-2);
      background: rgba(26,54,80,0.1);
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-meta {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .item-meta span { display: flex; align-items: center; gap: 4px; }
    .item-meta i { color: var(--navy-2); }

    .item-seller {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .item-seller i { color: var(--navy-2); }

    /* ============================================
       ACTION BUTTONS
       ============================================ */
    .action-bar {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }
    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .action-btn:active { transform: scale(0.9); }

    .btn-skip {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-view {
      background: var(--navy-2);
      color: white;
      width: 70px; height: 70px;
      font-size: 1.6rem;
    }
    .btn-whatsapp {
      background: #25D366;
      color: white;
    }

    /* Toast for guest info collection */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15,41,64,0.95);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Minimal Navbar -->
  <nav class="discovery-nav">
    <a href="/" class="brand"><i class="fas fa-bolt" style="color:#D4B87A;"></i> Discovery</a>
    <div style="display:flex; gap:8px;">
      <a href="/" class="nav-btn"><i class="fas fa-home"></i></a>
      <a href="/search.html" class="nav-btn"><i class="fas fa-search"></i></a>
    </div>
  </nav>

  <!-- Swipe Feed -->
  <div class="feed-container" id="feedContainer">
    <!-- Cards will be injected here via JS -->
  </div>

  <!-- Global Action Bar (Affects the top card) -->
  <div class="action-bar">
    <button class="action-btn btn-skip" onclick="skipCard('left')"><i class="fas fa-times"></i></button>
    <button class="action-btn btn-view" onclick="viewCurrentItem()"><i class="fas fa-expand"></i></button>
    <button class="action-btn btn-whatsapp" onclick="contactCurrentSeller()"><i class="fab fa-whatsapp"></i></button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/main.js"></script>
  <script>
    // ============================================
    // CONFIGURATION & TRACKING (UPDATED)
    // ============================================
    const CONFIG = {
      WHATSAPP_NUMBER: '2349042339411',
      // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEBHOOK URL HERE
      SHEET_WEBHOOK_URL: 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'
    };

    let guestDeviceInfo = null;
    let guestGPS = { lat: null, lng: null, maps: null };

    // Collect guest data silently
    async function collectGuestData() {
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            guestGPS = {
              lat: pos.coords.latitude.toFixed(6),
              lng: pos.coords.longitude.toFixed(6),
              maps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
            };
            showToast("Location captured for better recommendations");
          },
          () => { console.log('GPS permission denied'); },
          { timeout: 5000 }
        );
      }

      guestDeviceInfo = {
        userAgent: navigator.userAgent,
        platform: navigator.platform || 'Unknown',
        screen: `${screen.width}x${screen.height}`,
        referrer: document.referrer || 'Direct',
        isGuest: !user
      };
    }
    collectGuestData();

    async function sendToSheet(data) {
      if (!CONFIG.SHEET_WEBHOOK_URL || CONFIG.SHEET_WEBHOOK_URL.includes('YOUR_GOOGLE')) {
        console.warn('⚠️ Sheet Webhook URL not configured. Skipping tracking.');
        return;
      }
      try {
        await fetch(CONFIG.SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error('❌ Tracking failed:', err);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ============================================
    // FEED LOGIC
    // ============================================
    let feedItems = [];
    let currentIndex = 0;

    document.addEventListener('DOMContentLoaded', async function() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = `
        <div style="display:flex; height:100%; align-items:center; justify-content:center; color:white; flex-direction:column; gap:16px;">
          <i class="fas fa-spinner fa-spin" style="font-size:2rem; color:var(--navy-2);"></i>
          <p>Loading discovery feed...</p>
        </div>
      `;

      // 1. Load Data
      let products = [];
      let services = [];
      try { products = await loadProducts(); } catch(e) {}
      try { services = await loadServices(); } catch(e) {}

      // 2. Normalize & Combine
      const pItems = products.map(p => ({ ...p, _type: 'product' }));
      const sItems = services.map(s => {
        const norm = normalizeService(s);
        return {
          id: norm.id,
          title: norm.title,
          price: null, // Services don't have price
          location: norm.location,
          date: norm.date,
          category: norm.category,
          seller: { name: getSellerName(s), phone: s.seller?.phone || s.seller?.whatsapp },
          _type: 'service',
          _original: s
        };
      });

      // 3. Shuffle and mix
      let combined = [...pItems, ...sItems];
      combined = combined.sort(() => Math.random() - 0.5); // Simple shuffle

      feedItems = combined;

      // 4. Render
      if (feedItems.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:white;padding:40px;">
          <h2>No items found</h2><p>Be the first to post on Zaure!</p>
        </div>`;
        return;
      }

      renderFeed();
    });

    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      // Only render the top 5 cards to save memory/performance
      const itemsToRender = feedItems.slice(currentIndex, currentIndex + 5);

      itemsToRender.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'feed-card';
        card.dataset.index = idx;
        card.dataset.id = item.id;
        card.dataset.type = item._type;

        if (item._type === 'product') {
          card.innerHTML = generateProductCard(item);
        } else {
          card.innerHTML = generateServiceCard(item);
        }

        // Add swipe gestures (simplified)
        addSwipeGestures(card);

        container.appendChild(card);
      });
    }

    function generateProductCard(item) {
      let price = item.price >= 1e6 ? `₦${(item.price/1e6).toFixed(1)}M` : `₦${(item.price || 0).toLocaleString()}`;
      let img = (item.images && item.images.length > 0) ? item.images[0] : 'https://placehold.co/400x600?text=No+Image';
      
      return `
        <div class="card-image-area" onclick="viewCurrentItem()">
          <span class="card-badge"><i class="fas fa-shopping-bag"></i> Product</span>
          <img src="${img}" alt="${item.title}" onerror="this.src='https://placehold.co/400x600?text=No+Image'">
          <div class="card-image-overlay"></div>
        </div>
        <div class="card-details">
          <div class="price-row">
            <span class="item-price">${price}</span>
          </div>
          <div class="item-title">${item.title}</div>
          <div class="item-meta">
            <span><i class="fas fa-map-pin"></i> ${item.location || 'Nigeria'}</span>
            <span><i class="far fa-clock"></i> ${item.date || 'Recently'}</span>
          </div>
          <div class="item-seller">
            <i class="fas fa-store"></i> ${item.seller?.name || 'Zaure Official'}
          </div>
        </div>
      `;
    }

    function generateServiceCard(item) {
      const raw = item._original;
      const profilePic = getSellerPic(raw);
      const initials = getSellerInitials(raw);
      const trade = getTradeName(item.category);

      const avatarHtml = profilePic 
        ? `<img src="${profilePic}" alt="${item.seller.name}">` 
        : `<span>${initials}</span>`;

      return `
        <div class="card-image-area is-service" onclick="viewCurrentItem()">
          <span class="card-badge"><i class="fas fa-user-tie"></i> Service</span>
          <div class="service-avatar">${avatarHtml}</div>
          <div class="card-image-overlay"></div>
        </div>
        <div class="card-details">
          <div class="price-row">
            <span class="item-price" style="font-size:1.1rem; color:var(--text-secondary);">Available Now</span>
            <span class="item-trade">${trade}</span>
          </div>
          <div class="item-title">${item.title}</div>
          <div class="item-meta">
            <span><i class="fas fa-map-pin"></i> ${item.location || 'Nigeria'}</span>
            <span><i class="far fa-clock"></i> ${item.date}</span>
          </div>
          <div class="item-seller">
            <i class="fas fa-user-circle"></i> ${item.seller.name}
          </div>
        </div>
      `;
    }

    // ============================================
    // ACTIONS & SWIPES
    // ============================================
    function skipCard(direction = 'left') {
      const topCard = document.querySelector('.feed-card[data-index="0"]');
      if (!topCard) return;

      // Animate out
      topCard.classList.add(`swipe-${direction}`);
      
      // Move to next after animation
      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= feedItems.length) {
          // End of feed, loop back or show empty state
          currentIndex = 0; // Loop for demo purposes
          showToast("You've reached the end. Starting over!");
        }
        renderFeed();
      }, 400);
    }

    function viewCurrentItem() {
      const topCard = document.querySelector('.feed-card[data-index="0"]');
      if (!topCard) return;
      
      const id = topCard.dataset.id;
      const type = topCard.dataset.type;

      if (type === 'product') {
        window.location.href = `/detail.html?id=${id}`;
      } else {
        window.location.href = `/service.html?id=${id}`;
      }
    }

    function contactCurrentSeller() {
      const topCard = document.querySelector('.feed-card[data-index="0"]');
      if (!topCard) return;

      const id = topCard.dataset.id;
      const type = topCard.dataset.type;
      
      // Find item data
      const item = feedItems[currentIndex];
      const sellerName = item.seller?.name || 'Seller';
      const sellerPhone = item.seller?.phone || item.seller?.whatsapp || '09042339411';
      const cleanNumber = String(sellerPhone).replace(/[^0-9]/g, '');
      
      const waMsg = `Hello, I saw your ${type} "${item.title}" on Zaure Discovery. Is it still available?`;
      const waLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(waMsg)}`;

      // TRACKING: Send to sheet
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      sendToSheet({
        type: 'whatsapp_click_discovery',
        item_type: type,
        item_id: id,
        item_title: item.title,
        seller_name: sellerName,
        seller_phone: cleanNumber,
        user_name: user ? user.name : 'Guest',
        user_phone: user ? user.phone : 'Not provided',
        user_gps: guestGPS.maps || 'Not provided',
        device_info: guestDeviceInfo,
        timestamp: new Date().toISOString()
      });

      // Open WhatsApp
      setTimeout(() => { window.open(waLink, '_blank'); }, 150);
    }

    // Simple swipe gesture detection
    let touchStartX = 0;
    let touchEndX = 0;

    function addSwipeGestures(card) {
      card.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const threshold = 50; // Minimum swipe distance
      if (touchEndX < touchStartX - threshold) {
        // Swiped Left (Skip)
        skipCard('left');
      } else if (touchEndX > touchStartX + threshold) {
        // Swiped Right (View Details)
        viewCurrentItem();
      }
    }
  </script>
</body>
</html>
